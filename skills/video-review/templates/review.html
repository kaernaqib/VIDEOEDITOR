<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one review column, player on top, timeline strip with comment markers, then the comment list. Dark-first like an editing suite. */
:root{
  --bg:#14161a; --panel:#1d2026; --line:#2c3038; --fg:#e8e9ec; --muted:#9097a3;
  --accent:#f0b43c; --accent-ink:#1a1405; --done:#5fbf8a; --danger:#e0645c;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f4f4f2; --panel:#ffffff; --line:#dcdcd6; --fg:#1b1d21; --muted:#646a74;
  --accent:#b97a00; --accent-ink:#ffffff; --done:#2f8a58; --danger:#b8392f; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f4f4f2; --panel:#ffffff; --line:#dcdcd6; --fg:#1b1d21; --muted:#646a74;
  --accent:#b97a00; --accent-ink:#ffffff; --done:#2f8a58; --danger:#b8392f; color-scheme:light}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
h1{font-size:20px;font-weight:600;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.versions{display:flex;gap:6px;flex-wrap:wrap}
.versions button{font:500 13px var(--mono);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
.versions button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:16px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{display:grid;gap:10px}
.player{background:#000;border-radius:8px;overflow:hidden;display:flex;justify-content:center}
video{display:block;max-width:100%;max-height:72vh;width:auto;background:#000}
.strip{position:relative;height:22px;background:var(--panel);border:1px solid var(--line);border-radius:6px;cursor:pointer}
.strip .head{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent);pointer-events:none}
.strip .mk{position:absolute;top:4px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);padding:0;cursor:pointer}
.strip .mk.done{background:var(--done)}
.note{color:var(--muted);font-size:13px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:grid;min-width:0}
.compose{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.compose label{font-size:13px;color:var(--muted)}
.tc{font:500 13px var(--mono);font-variant-numeric:tabular-nums}
textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;min-height:64px;resize:vertical}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{font:600 14px var(--sans);background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.ghost{font:500 13px var(--sans);background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:5px 10px;cursor:pointer}
.filters{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.filters button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
ol{list-style:none;margin:0;padding:0;max-height:62vh;overflow:auto}
li{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:4px}
li:last-child{border-bottom:0}
li .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
li .t{font:500 12px var(--mono);background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:4px;padding:1px 6px;cursor:pointer}
li .txt{white-space:pre-wrap;overflow-wrap:anywhere}
li .reply{font-size:13px;color:var(--done);border-left:2px solid var(--done);padding-left:8px}
.pill{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 8px}
.pill.open{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.pill.done{background:color-mix(in srgb,var(--done) 18%,transparent);color:var(--done)}
.del{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px}
.del:hover{color:var(--danger)}
.empty{padding:20px 14px;color:var(--muted);font-size:14px}
.status{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1 id="title"></h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="versions" id="versions" aria-label="Versi"></div>
  </header>

  <div class="main">
    <div class="stage">
      <div class="player"><video id="vid" controls playsinline preload="metadata"></video></div>
      <div class="strip" id="strip" title="Klik untuk lompat"><div class="head" id="head"></div></div>
      <div class="note" id="vnote"></div>
    </div>

    <aside>
      <form class="compose" id="form">
        <label for="txt">Komen pada <span class="tc" id="now">0:00.0</span> (video berhenti bila awak mula menaip)</label>
        <textarea id="txt" placeholder="cth. potong jeda ni, subtitle terlalu cepat, tambah SFX di sini"></textarea>
        <div class="row">
          <span class="status" id="status">Menyambung...</span>
          <button class="btn" id="send" type="submit" disabled>Tambah komen</button>
        </div>
      </form>
      <div class="filters">
        <button class="ghost" type="button" data-f="open" aria-pressed="true">Belum selesai</button>
        <button class="ghost" type="button" data-f="all" aria-pressed="false">Semua</button>
      </div>
      <ol id="list"><li class="empty">Belum ada komen untuk versi ni. Main video, berhenti di mana-mana, dan tulis apa yang nak diubah.</li></ol>
    </aside>
  </div>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const vid = $('vid'), strip = $('strip'), head = $('head'), list = $('list');
let cur = DATA.versions[DATA.versions.length - 1].v;
let filter = 'open', comments = [], db = null, user = null, me = null, names = {};

const fmt = t => { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = (t % 60).toFixed(1).padStart(4, '0'); return m + ':' + s; };

$('title').textContent = DATA.title;
document.title = DATA.title;

function renderVersions() {
  const box = $('versions'); box.textContent = '';
  for (const v of DATA.versions) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = 'v' + v.v; b.setAttribute('aria-pressed', v.v === cur);
    b.onclick = () => { cur = v.v; load(); };
    box.appendChild(b);
  }
}
function load() {
  const v = DATA.versions.find(x => x.v === cur);
  vid.src = v.file;
  $('vnote').textContent = v.note ? 'v' + v.v + ': ' + v.note : '';
  $('sub').textContent = DATA.versions.length + ' versi · tengok v' + cur;
  renderVersions(); render();
}

vid.addEventListener('timeupdate', () => {
  $('now').textContent = fmt(vid.currentTime);
  if (vid.duration) head.style.left = (vid.currentTime / vid.duration * 100) + '%';
});
vid.addEventListener('loadedmetadata', render);
strip.addEventListener('click', e => {
  if (e.target.classList.contains('mk') || !vid.duration) return;
  const r = strip.getBoundingClientRect();
  vid.currentTime = (e.clientX - r.left) / r.width * vid.duration;
});
$('txt').addEventListener('focus', () => vid.pause());
$('txt').addEventListener('input', () => { vid.pause(); $('send').disabled = !db || !$('txt').value.trim(); });
document.querySelectorAll('.filters button').forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});

function seek(t) { vid.currentTime = t; vid.pause(); }

async function render() {
  const mine = comments.filter(c => c.v === cur).sort((a, b) => a.t - b.t);
  strip.querySelectorAll('.mk').forEach(m => m.remove());
  if (vid.duration) for (const c of mine) {
    const m = document.createElement('button');
    m.type = 'button'; m.className = 'mk' + (c.status === 'done' ? ' done' : '');
    m.style.left = Math.min(100, c.t / vid.duration * 100) + '%';
    m.title = fmt(c.t) + ' ' + c.text; m.setAttribute('aria-label', 'Komen pada ' + fmt(c.t));
    m.onclick = () => seek(c.t);
    strip.appendChild(m);
  }
  const shown = mine.filter(c => filter === 'all' || c.status !== 'done');
  list.textContent = '';
  if (!shown.length) {
    const li = document.createElement('li'); li.className = 'empty';
    li.textContent = mine.length ? 'Semua komen versi ni dah selesai.' : 'Belum ada komen untuk versi ni. Main video, berhenti di mana-mana, dan tulis apa yang nak diubah.';
    list.appendChild(li); return;
  }
  const ids = [...new Set(shown.map(c => c.by).filter(Boolean))];
  if (user && ids.length) { try { names = await user.profiles(ids); } catch (e) {} }
  for (const c of shown) {
    const li = document.createElement('li');
    const meta = document.createElement('div'); meta.className = 'meta';
    const t = document.createElement('button'); t.type = 'button'; t.className = 't'; t.textContent = fmt(c.t); t.onclick = () => seek(c.t);
    const who = document.createElement('span'); who.textContent = (names[c.by] && names[c.by].name) || 'Seseorang';
    const p = document.createElement('span'); p.className = 'pill ' + (c.status === 'done' ? 'done' : 'open'); p.textContent = c.status === 'done' ? 'Selesai' : 'Baru';
    meta.append(t, who, p);
    if (me && c.by === me) {
      const d = document.createElement('button'); d.type = 'button'; d.className = 'del'; d.textContent = 'Padam';
      d.onclick = async () => { try { await db.doc('comments/' + c.id).delete(); } catch (e) { $('status').textContent = 'Tak dapat padam: ' + e.code; } };
      meta.appendChild(d);
    }
    const txt = document.createElement('div'); txt.className = 'txt'; txt.textContent = c.text;
    li.append(meta, txt);
    if (c.reply) { const r = document.createElement('div'); r.className = 'reply'; r.textContent = 'Claude: ' + c.reply; li.appendChild(r); }
    list.appendChild(li);
  }
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const text = $('txt').value.trim();
  if (!text || !db) return;
  $('send').disabled = true;
  try {
    await db.collection('comments').add({ v: cur, t: Math.round(vid.currentTime * 10) / 10, text, by: me, at: new Date().toISOString(), status: 'open' });
    $('txt').value = ''; $('status').textContent = 'Komen disimpan.';
  } catch (err) {
    $('status').textContent = err.code === 'invalid_argument' ? 'Awak cuma boleh tengok. Minta akses "Contributor" untuk komen.' : 'Tak dapat simpan. Cuba lagi.';
    $('send').disabled = false;
  }
});

load();

(async () => {
  if (!window.claude) { $('status').textContent = 'Komen hanya berfungsi dalam claude.ai.'; return; }
  [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (user) { try { me = await user.id(); } catch (e) {} }
  if (!db) { $('status').textContent = 'Log masuk ke claude.ai untuk tengok dan tulis komen.'; return; }
  const timer = setTimeout(() => { $('status').textContent = 'Komen belum dapat dimuatkan. Mungkin talian perlahan.'; }, 10000);
  db.collection('comments').onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); $('status').textContent = 'Komen disegerakkan.'; }
    comments = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    render();
  }, err => { clearTimeout(timer); $('status').textContent = 'Komen tak dapat dimuatkan (' + err.code + ').'; });
  let canWrite = null;
  if (user && user.can) { try { canWrite = await user.can('data.write'); } catch (e) {} }
  if (canWrite === false) { $('status').textContent = 'Awak cuma boleh tengok komen.'; $('txt').disabled = true; }
  $('send').disabled = !$('txt').value.trim();
})();
</script>
