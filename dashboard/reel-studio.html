<title>Agent Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Anton&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell. Fixed glass sidebar (nav grouped Utama / Agent / Sumber) + top bar (search, alerts)
   + per-view banner (title, period, refresh) + view body. Every agent shares one registry, so a new agent
   is one entry. Glass panels float over #0E0F17 with soft colour fields behind them. Single dark look by choice. */
:root {
  color-scheme: dark;
  --bg: #0e0f17;
  --glass: rgba(255, 255, 255, 0.045);
  --glass-2: rgba(255, 255, 255, 0.075);
  --glass-strong: rgba(22, 24, 36, 0.72);
  --stroke: rgba(255, 255, 255, 0.085);
  --stroke-2: rgba(255, 255, 255, 0.16);
  --fg: #eef0f7;
  --sub: #a4a9bd;
  --dim: #6c7189;
  --accent: #e58e5e;
  --accent-ink: #1b0e07;
  --accent-soft: rgba(229, 142, 94, 0.16);
  --c-video: #e58e5e;
  --c-poster: #a98bf0;
  --c-copy: #4cc9b0;
  --c-ads: #6aa6f4;
  --brand-yellow: #ffd21f;
  --good: #5fd39a;
  --warn: #f0b955;
  --bad: #f2705f;
  --font-ui: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Anton", Impact, "Arial Narrow", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r-xl: 22px;
  --r-lg: 18px;
  --r-md: 14px;
  --r-sm: 10px;
  --side-w: 248px;
  --blur: blur(22px) saturate(145%);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(520px 420px at 12% 8%, rgba(229, 142, 94, 0.20), transparent 70%),
    radial-gradient(620px 520px at 88% 14%, rgba(106, 104, 244, 0.17), transparent 70%),
    radial-gradient(560px 480px at 62% 96%, rgba(76, 201, 176, 0.11), transparent 70%),
    var(--bg);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.glass {
  background: var(--glass); border: 1px solid var(--stroke); border-radius: var(--r-xl);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 18px 40px -24px rgba(0, 0, 0, 0.7);
}

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px));
  display: flex; flex-direction: column; border-right: 1px solid var(--stroke);
  background: rgba(14, 15, 23, 0.55); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  padding: 16px 12px 14px max(12px, env(safe-area-inset-left, 0px)); z-index: 20;
}
.side-top { display: flex; align-items: center; gap: 10px; padding: 2px 6px 16px; }
.logo { display: flex; align-items: center; gap: 10px; margin-right: auto; font-weight: 800; letter-spacing: -.2px; font-size: 15.5px; }
.logo-mark {
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-family: var(--font-display);
  font-size: 15px; color: var(--accent-ink); background: linear-gradient(145deg, #f2a77b, #c4683b);
  box-shadow: 0 6px 18px -6px rgba(229, 142, 94, .7);
}
.logo small { display: block; color: var(--dim); font-weight: 600; font-size: 11px; letter-spacing: .2px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--sub);
  background: var(--glass); border: 1px solid var(--stroke); position: relative; flex: none;
}
.icon-btn:hover { color: var(--fg); border-color: var(--stroke-2); }
.icon-btn .badge {
  position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--bad); color: #fff; font-size: 10.5px; font-weight: 800; display: grid; place-items: center;
}
.nav { flex: 1; overflow-y: auto; display: grid; align-content: start; gap: 2px; padding-right: 2px; }
.nav-label { color: var(--dim); font-size: 10.5px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; padding: 14px 12px 6px; }
.nav a {
  display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
  color: var(--sub); text-decoration: none; font-weight: 600; border: 1px solid transparent;
}
.nav a:hover { color: var(--fg); background: var(--glass); }
.nav a[aria-current="page"] { color: var(--fg); background: var(--glass-2); border-color: var(--stroke); }
.nav a[aria-current="page"] svg { color: var(--nav-c, var(--accent)); }
.nav a .count { font-family: var(--font-mono); font-size: 11.5px; color: var(--dim); }
.nav a .soon { font-size: 9.5px; font-weight: 800; letter-spacing: .6px; padding: 2px 6px; border-radius: 6px; color: var(--dim); border: 1px dashed var(--dim); }
.nav .dotc { width: 8px; height: 8px; border-radius: 50%; justify-self: center; }
.side-foot { border-top: 1px solid var(--stroke); padding: 12px 8px 0; display: grid; gap: 8px; }
.status { font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 8px; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
.status.ok i { background: var(--good); }
.status.off i { background: var(--bad); }

.content { min-width: 0; display: grid; align-content: start; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; display: flex; align-items: center; gap: 10px;
  padding-block: 12px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--stroke); background: rgba(14, 15, 23, 0.6); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
}
.menu-btn { display: none; }
.search { position: relative; flex: 1; max-width: 420px; }
.search input {
  width: 100%; height: 40px; border-radius: 12px; border: 1px solid var(--stroke); background: var(--glass);
  padding: 0 14px 0 38px; color: var(--fg);
}
.search input:focus { outline: none; border-color: var(--accent); }
.search svg { position: absolute; left: 12px; top: 11px; color: var(--dim); }
.results {
  position: absolute; left: 0; right: 0; top: 46px; border-radius: var(--r-md); padding: 6px; display: grid; gap: 2px;
  background: var(--glass-strong); border: 1px solid var(--stroke-2); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  max-height: 340px; overflow-y: auto;
}
.results button { text-align: left; display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 9px; border: 0; background: transparent; }
.results button:hover, .results button:focus-visible { background: var(--glass-2); }
.results small { color: var(--dim); }
.top-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.me { display: flex; align-items: center; gap: 10px; padding-left: 8px; border-left: 1px solid var(--stroke); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: linear-gradient(145deg, #3a3f5c, #23263a); border: 1px solid var(--stroke-2); }
.me b { display: block; font-size: 13px; }
.me small { color: var(--dim); font-size: 11px; }

.page {
  display: grid; gap: 18px; padding-block: 22px 56px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  max-width: 1500px; width: 100%;
}
.page > * { min-width: 0; }

/* banner, as in the reference: icon tile + title + sub on the left, period + refresh on the right */
.banner {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 20px 22px; position: relative; overflow: hidden;
  background: linear-gradient(110deg, color-mix(in srgb, var(--bc, var(--accent)) 26%, transparent), rgba(255, 255, 255, 0.03) 55%, rgba(255, 255, 255, 0.02));
}
.banner-icon {
  width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; flex: none;
  color: var(--bc, var(--accent)); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--stroke-2);
}
.banner h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.4px; text-wrap: balance; }
.banner p { margin: 2px 0 0; color: var(--sub); }
.banner-text { flex: 1; min-width: 200px; }
.banner-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill { font-size: 10.5px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--stroke-2); color: var(--sub); vertical-align: middle; margin-left: 8px; }
.pill.live { color: var(--good); border-color: rgba(95, 211, 154, .4); background: rgba(95, 211, 154, .08); }
.pill.plan { color: var(--warn); border-color: rgba(240, 185, 85, .4); background: rgba(240, 185, 85, .08); }

.btn {
  border: 1px solid var(--stroke); background: var(--glass); color: var(--fg); border-radius: 12px; padding: 9px 15px;
  font-weight: 700; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
}
.btn:hover { border-color: var(--stroke-2); background: var(--glass-2); }
a.btn { text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 8px 22px -10px rgba(229, 142, 94, .8); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.small { padding: 6px 11px; font-size: 12.5px; border-radius: 10px; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.select, .input, textarea.input {
  width: 100%; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--stroke); border-radius: var(--r-sm); padding: 10px 12px; color: var(--fg);
}
.select option { background: #181a26; }
textarea.input { resize: vertical; min-height: 66px; }
.input:focus, .select:focus { outline: none; border-color: var(--accent); }
.banner .select { width: auto; height: 40px; padding: 0 12px; }

.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-head h2 { margin: 0; font-size: 16.5px; font-weight: 700; }
.sec-head p { margin: 2px 0 0; color: var(--dim); font-size: 12.5px; }
.block { padding: 18px 20px; }
.eyebrow { color: var(--dim); font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 800; }
.note { color: var(--dim); font-size: 12px; }
.empty { border: 1px dashed var(--stroke-2); border-radius: var(--r-md); padding: 20px; text-align: center; color: var(--sub); font-size: 13px; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { padding: 18px 20px 16px; min-width: 0; }
.kpi-head { display: flex; align-items: center; gap: 10px; color: var(--sub); font-weight: 600; }
.kpi-icon { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: rgba(255, 255, 255, .06); color: var(--accent); flex: none; border: 1px solid var(--stroke); }
.kpi-num { font-weight: 800; font-size: 40px; letter-spacing: -1.4px; margin: 14px 0 12px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi-foot { border-top: 1px solid var(--stroke); padding-top: 11px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi-foot span { display: block; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-foot b { font-size: 15.5px; font-variant-numeric: tabular-nums; }

/* agent cards */
.agents { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1250px) { .agents { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .agents { grid-template-columns: minmax(0, 1fr); } }
.agent-card { padding: 18px; display: grid; gap: 12px; align-content: start; position: relative; overflow: hidden; }
.agent-card::before { content: ""; position: absolute; inset: -40% -30% auto auto; width: 180px; height: 180px; border-radius: 50%; background: var(--ac); opacity: .16; filter: blur(30px); pointer-events: none; }
.agent-top { display: flex; align-items: center; gap: 12px; }
.agent-ic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: var(--ac); background: rgba(255, 255, 255, .06); border: 1px solid var(--stroke-2); flex: none; }
.agent-card h3 { margin: 0; font-size: 15px; }
.agent-card p { margin: 0; color: var(--sub); font-size: 12.5px; }
.agent-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.agent-stats div { background: rgba(255, 255, 255, .04); border: 1px solid var(--stroke); border-radius: 11px; padding: 8px 10px; }
.agent-stats b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.agent-stats span { color: var(--dim); font-size: 11px; }
.agent-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.agent-card.add { border-style: dashed; place-content: center; text-align: center; color: var(--sub); min-height: 200px; }

.two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 1000px) { .two { grid-template-columns: minmax(0, 1fr); } }
.list { display: grid; gap: 6px; }
.li {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 13px;
  background: rgba(255, 255, 255, .035); border: 1px solid var(--stroke); text-align: left; width: 100%;
}
.li:hover { border-color: var(--stroke-2); }
.li-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--lc); background: rgba(255, 255, 255, .06); }
.li b { display: block; font-size: 13.5px; overflow-wrap: anywhere; }
.li small { color: var(--dim); font-size: 12px; }
.li .tag { font-size: 10.5px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.tag.late { color: var(--bad); background: rgba(242, 112, 95, .12); }
.tag.review { color: var(--warn); background: rgba(240, 185, 85, .12); }
.tag.done { color: var(--good); background: rgba(95, 211, 154, .12); }
.tag.neutral { color: var(--sub); background: rgba(255, 255, 255, .06); }

.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.days-scroll { overflow-x: auto; }
@media (max-width: 760px) { .days { grid-template-columns: repeat(7, minmax(96px, 1fr)); } }
.day { background: rgba(255, 255, 255, .035); border: 1px solid var(--stroke); border-radius: var(--r-md); padding: 10px; min-height: 96px; display: grid; align-content: start; gap: 6px; }
.day.today { border-color: var(--accent); background: var(--accent-soft); }
.day-label { display: flex; justify-content: space-between; color: var(--sub); font-size: 11px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; }
.day-label b { color: var(--fg); font-family: var(--font-mono); }
.day-item { font-size: 12px; padding: 5px 7px; border-radius: 7px; background: rgba(255, 255, 255, .06); border: 0; border-left: 3px solid var(--ic, var(--accent)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; color: var(--fg); }

/* board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(214px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.col { background: rgba(255, 255, 255, .03); border: 1px solid var(--stroke); border-radius: var(--r-lg); padding: 10px; display: grid; align-content: start; gap: 8px; min-height: 190px; }
.col.drop { outline: 2px dashed var(--accent); outline-offset: -4px; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px; font-weight: 700; font-size: 13px; }
.col-head .dot { width: 8px; height: 8px; border-radius: 50%; }
.col-head small { margin-left: auto; color: var(--dim); font-family: var(--font-mono); }
.col-hint { color: var(--dim); font-size: 12px; padding: 4px 6px; }
.card {
  background: rgba(255, 255, 255, .055); border: 1px solid var(--stroke); border-radius: 13px; padding: 11px 12px;
  display: grid; gap: 8px; text-align: left; color: var(--fg); width: 100%;
}
.card:hover { border-color: var(--stroke-2); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.card-title { font-weight: 700; font-size: 13.5px; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 10.5px; font-weight: 800; letter-spacing: .5px; padding: 3px 8px; border-radius: 999px; background: rgba(255, 255, 255, .06); color: var(--sub); text-transform: uppercase; }
.chip.k { color: var(--kc, var(--accent)); background: color-mix(in srgb, var(--kc, var(--accent)) 16%, transparent); }
.chip.late { color: var(--bad); background: rgba(242, 112, 95, .12); }
.card-meta { display: flex; justify-content: space-between; color: var(--dim); font-size: 11.5px; gap: 8px; }
.progress { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--stroke); background: rgba(255, 255, 255, .04); color: var(--sub); padding: 7px 12px; border-radius: 999px; font-weight: 700; font-size: 12.5px; }
.seg button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* video top row */
.vtop { display: grid; grid-template-columns: minmax(250px, .9fr) minmax(0, 2fr); gap: 14px; }
@media (max-width: 1000px) { .vtop { grid-template-columns: minmax(0, 1fr); } }
.target { padding: 16px 18px; display: grid; grid-template-columns: 92px 1fr; gap: 16px; align-items: center; }
.ring { width: 92px; height: 92px; }
.target h3 { margin: 4px 0 6px; font-size: 15px; }
.stepper { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; }
.stepper button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--stroke); background: var(--glass); }
.stepper span { min-width: 24px; text-align: center; font-family: var(--font-mono); }
.stages { padding: 14px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 700px) { .stages { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.stage-tile { background: rgba(255, 255, 255, .04); border: 1px solid var(--stroke); border-radius: 13px; padding: 10px 12px; text-align: left; color: var(--fg); }
.stage-tile:hover { border-color: var(--stroke-2); }
.stage-tile span { display: flex; align-items: center; gap: 6px; color: var(--sub); font-size: 11.5px; font-weight: 700; }
.stage-tile i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.stage-tile b { display: block; font-size: 22px; margin-top: 4px; font-variant-numeric: tabular-nums; }

/* drawer */
.drawer { padding: 18px 20px 20px; display: grid; gap: 16px; }
.drawer-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 1000px) { .drawer-grid { grid-template-columns: minmax(0, 1fr); } }
.stack { display: grid; gap: 12px; align-content: start; min-width: 0; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > label, .field > .lbl { color: var(--sub); font-size: 12px; font-weight: 700; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .row2 { grid-template-columns: 1fr; } }
.checks { display: grid; gap: 6px; }
.check { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; padding: 9px 10px; border-radius: var(--r-sm); background: rgba(255, 255, 255, .04); border: 1px solid var(--stroke); cursor: pointer; }
.check input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--accent); }
.check span { font-size: 13px; }
.check small { display: block; color: var(--dim); font-size: 11.5px; }
.check.done span { color: var(--dim); text-decoration: line-through; }
.prompt-box { background: rgba(5, 6, 12, .6); border: 1px solid var(--stroke); border-radius: var(--r-md); padding: 14px; font-family: var(--font-mono); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; color: #f4dccb; }
.warn-box { border: 1px solid rgba(240, 185, 85, .35); background: rgba(240, 185, 85, .07); color: #f5d9a2; border-radius: var(--r-md); padding: 10px 12px; font-size: 12.5px; }
.drawer-foot { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; align-items: center; border-top: 1px solid var(--stroke); padding-top: 14px; }
.drawer-foot > div { display: flex; gap: 8px; flex-wrap: wrap; }

  const startOfWeek = () => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); };
  const periodStart = () => { const d = new Date(); d.setHours(0, 0, 0, 0); if (period === "week") return startOfWeek(); if (period === "month") { d.setDate(1); return d.getTime(); } return Date.now() - 30 * 864e5; };
  const PERIODS = { week: "Minggu ni", month: "Bulan ni", d30: "30 hari" };

  // ------------------------------------------------------------------ state
  let db = null, readOnly = false, memId = 0;
  let projects = [], tasks = [], hooks = [], settings = { weeklyTarget: 4 };
  let view = "overview", period = "week", fmtFilter = "all";
  let draft = null, selectedKey = null;
  try { const p = localStorage.getItem("as-period"); if (PERIODS[p]) period = p; } catch (_) {}

  const allItems = () => [
    ...projects.map((p) => ({ ...p, agent: "video", kind: "video", done: p.stage === "posted", review: p.stage === "semak", doneAt: p.postedAt })),
    ...tasks.map((t) => ({ ...t, kind: "task", done: t.stage === "siap", review: t.stage === "semak" })),
  ];
  const isLate = (x) => x.due && !x.done && x.due < ymd(new Date());
  const itemColor = (x) => AGENTS[x.agent]?.color || "var(--accent)";
  const stageName = (x) => (x.kind === "video" ? VSTAGES : TSTAGES).find((s) => s.id === x.stage)?.name || x.stage;
  const vCheckPct = (p) => { const l = VCHECKS[p.stage] || []; if (!l.length) return null; const c = p.checks || {}; return Math.round(100 * l.filter(([k]) => c[`${p.stage}.${k}`]).length / l.length); };
  const tCheckPct = (t) => { if (t.stage !== "semak") return null; const l = AGENTS[t.agent].checks; const c = t.checks || {}; return Math.round(100 * l.filter(([k]) => c[k]).length / l.length); };

  // ------------------------------------------------------------------ ui bits
  let toastT;
  const toast = (m) => { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2200); };
  const setStatus = (k, m) => { const s = $("#status"); s.className = "status " + k; s.querySelector("span").textContent = m; };

  function renderNav() {
    const items = allItems();
    const active = (a) => items.filter((x) => x.agent === a && !x.done).length;
    const link = (id, label, ic, extra = "", color = "") =>
      `<a href="#${id}" ${view === id ? 'aria-current="page"' : ""} ${color ? `style="--nav-c:${color}"` : ""}>${svg(ic)}<span>${label}</span>${extra}</a>`;
    $("#nav").innerHTML = `
      <div class="nav-label">Utama</div>
      ${link("overview", "Overview", "home")}
      <div class="nav-label">Agent</div>
      ${Object.entries(AGENTS).map(([k, a]) => link(k, a.short, a.icon, a.live ? `<span class="count">${active(k)}</span>` : `<span class="soon">BINA</span>`, a.color)).join("")}
      ${link("agent-baru", "Tambah agent", "plus")}
      <div class="nav-label">Sumber</div>
      ${link("hooks", "Hook Bank", "hook", `<span class="count">${hooks.length}</span>`)}
      ${link("style", "Gaya & Brand", "palette")}`;
    const attn = items.filter((x) => isLate(x) || x.review).length;
    const b = $("#bell-n"); b.hidden = !attn; b.textContent = attn;
  }

  function banner({ icon, color, title, sub, pill, actions }) {
    return `<section class="glass banner" style="--bc:${color || "var(--accent)"}">
      <div class="banner-icon">${svg(icon, 22)}</div>
      <div class="banner-text"><h1>${esc(title)}${pill || ""}</h1><p>${esc(sub)}</p></div>
      <div class="banner-actions">${actions || ""}</div>
    </section>`;
  }
  const periodSelect = () => `<label class="visually-hidden" for="period" hidden>Tempoh</label><select class="select" id="period">${Object.entries(PERIODS).map(([k, v]) => `<option value="${k}" ${period === k ? "selected" : ""}>${v}</option>`).join("")}</select>`;
  const refreshBtn = `<button class="btn" type="button" data-act="refresh">${svg("refresh", 16)} Refresh</button>`;

  // ------------------------------------------------------------------ views
  function mount() {
    const page = $("#page");
    draft = null; selectedKey = null;
    if (view === "overview") {
      page.innerHTML = banner({ icon: "spark", title: "Overview", sub: "Semua agent dan tugas kau dalam satu skrin", actions: periodSelect() + refreshBtn }) +
        `<section class="kpis" id="ov-kpis"></section>
         <section><div class="sec-head"><div><h2>Agent kau</h2><p>Buka agent untuk brief tugas baru, atau tambah agent lain.</p></div><a class="btn small" href="#agent-baru">${svg("plus", 15)} Tambah agent</a></div><div class="agents" id="ov-agents"></div></section>
         <section class="two"><div class="glass block"><div class="sec-head"><div><h2>Perlu perhatian</h2><p>Tunggu semak atau dah lewat.</p></div></div><div class="list" id="ov-attn"></div></div>
           <div class="glass block"><div class="sec-head"><div><h2>Aktiviti terkini</h2><p>Kemas kini terbaru merentas agent.</p></div></div><div class="list" id="ov-activity"></div></div></section>
         <section class="glass block"><div class="sec-head"><div><h2>7 hari akan datang</h2><p>Ikut tarikh siap / post.</p></div></div><div class="days-scroll"><div class="days" id="ov-week"></div></div></section>`;
    } else if (view === "video") {
      page.innerHTML = banner({ icon: "video", color: AGENTS.video.color, title: "Video Agent", pill: '<span class="pill live">Aktif</span>', sub: "Skill reel-editor: edit reel terus dalam project CapCut kau", actions: refreshBtn + `<button class="btn primary" type="button" data-act="new">+ Video baru</button>` }) +
        `<section class="vtop"><div class="glass target" id="v-target"></div><div class="glass stages" id="v-stages"></div></section>
         <section class="glass block"><div class="sec-head"><div><h2>Pipeline video</h2><p>Seret kad ke peringkat lain, atau klik untuk edit.</p></div><div class="seg" id="v-filter"></div></div><div class="board" id="board"></div></section>
         <section class="glass drawer" id="drawer" hidden></section>`;
    } else if (AGENTS[view]) {
      const a = AGENTS[view];
      page.innerHTML = banner({ icon: a.icon, color: a.color, title: a.name, pill: a.live ? '<span class="pill live">Aktif</span>' : '<span class="pill plan">Skill belum dibina</span>', sub: a.desc, actions: refreshBtn + `<button class="btn primary" type="button" data-act="new">+ Tugas baru</button>` }) +
        (a.live ? "" : `<div class="warn-box">Kau dah boleh brief dan susun tugas di sini. Untuk agent ni jalan, skill <b>${esc(a.skill)}</b> perlu dibina dulu. Minta Claude: <i>“Bina skill ${esc(a.skill)} untuk Agent Studio.”</i></div>`) +
        `<section class="glass block"><div class="sec-head"><div><h2>Tugas ${esc(a.short)}</h2><p>Brief → agent jalan → semak → siap.</p></div></div><div class="board" id="board"></div></section>
         <section class="glass drawer" id="drawer" hidden></section>`;
    } else if (view === "hooks") {
      page.innerHTML = banner({ icon: "hook", title: "Hook Bank", sub: "Saat 0–2 tentukan orang stay atau scroll. Simpan idea, guna terus." }) +
        `<section class="two"><div class="glass block"><div class="sec-head"><div><h2>Formula hook</h2><p>Templat yang terbukti.</p></div></div><div class="list" id="formulas"></div></div>
          <div class="glass block"><div class="sec-head"><div><h2>Hook kau</h2><p>Satu klik jadi video baru.</p></div></div>
            <form id="hook-form" class="row2" style="grid-template-columns:1fr auto;align-items:end;margin-bottom:12px">
              <div class="field"><label for="hook-text">Hook baru</label><input class="input" id="hook-text" placeholder="Contoh: 3 sebab customer kata mahal…" maxlength="160"></div>
              <button class="btn primary" type="submit">Simpan</button></form>
            <div class="list" id="hooks"></div></div></section>`;
    } else if (view === "style") {
      page.innerHTML = banner({ icon: "palette", title: "Gaya & Brand", sub: "Style pack untuk Video Agent, diukur dari reel rujukan. Format = struktur isi." }) +
        `<section class="glass block"><div class="sec-head"><div><h2>Style pack</h2><p>Setiap style = satu folder dalam skill reel-editor (styles/&lt;nama&gt;) + satu template CapCut "STYLE &lt;nama&gt;".</p></div><a class="btn small" href="#agent-baru">+ Style baru</a></div>
          <div class="style-cols">${Object.entries(STYLES).map(([k, st]) => `<div class="style-card"><div class="eyebrow">${esc(st.name)} · ${esc(st.ref)}</div>
            <div class="style-sample">${st.sample === "a" ? '<div class="sample-a">talking about is<em>budget</em></div>' : '<div class="sample-b"><i>Do you wanna make</i><strong>BETTER</strong></div>'}</div>
            <ul class="rules">${st.rules.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>
            <div class="chips">${st.measured.map(([n, v]) => `<span class="chip">${esc(n)}: ${esc(v)}</span>`).join("")}</div></div>`).join("")}</div>
          <div class="eyebrow" style="margin:16px 0 10px">Palet brand</div>
          <div class="swatches">${[["#FFD21F", "#FFD21F"], ["#FFFFFF", "#FFFFFF"], ["#0A0A0A", "#0A0A0A"], ["#8A8A8A", "#8A8A8A"], ["#FF3B30", "DON'T"], ["#34C759", "DO"]].map(([c, n]) => `<div class="sw"><i style="background:${c}"></i>${n}</div>`).join("")}</div>
          <div class="eyebrow" style="margin:16px 0 10px">Spesifikasi export</div>
          <div class="chips"><span class="chip">9:16 · 1080×1920</span><span class="chip">30 fps</span><span class="chip">Suara −14 LUFS</span><span class="chip">Muzik ~15 dB bawah suara</span></div></section>
         <section class="grid2">${FORMAT_GUIDE.map((g) => `<div class="glass block"><div class="sec-head"><div><h2>${esc(FORMATS[g.f].name)}</h2><p>Style default: ${esc(STYLES[FORMATS[g.f].style].name)}</p></div></div><div class="timeline">${g.rows.map(([a, b]) => `<div class="tl-row"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("")}</div></div>`).join("")}</section>`;
    } else if (view === "agent-baru") {
      const ideas = [["Thumbnail Agent", "Cover reel & thumbnail YouTube dari frame terbaik"], ["Caption & Hashtag Agent", "Caption post + hashtag ikut platform, terus dari transkrip video"], ["Content Calendar Agent", "Rancang 30 hari konten dari satu topik"], ["Analytics Agent", "Baca prestasi post & ads, cadang apa nak buat seterusnya"]];
      page.innerHTML = banner({ icon: "plus", title: "Tambah agent", sub: "Setiap agent = satu skill Claude + satu ruang kerja di sini." }) +
        `<section class="two"><div class="glass block"><div class="sec-head"><div><h2>Cara tambah</h2></div></div>
          <ol class="steps"><li>Minta Claude <b>bina skill</b> untuk kerja tu (contoh: poster-agent).</li><li>Upload skill ke <b>Claude desktop app</b> (Settings → Skills) dan push ke repo VIDEOEDITOR.</li><li>Minta Claude <b>tambah agent ke Agent Studio</b>. Agent baru muncul di menu kiri dengan brief, papan tugas dan checklist sendiri.</li></ol>
          <div class="field" style="margin-top:14px"><span class="lbl">Arahan untuk Claude</span><div class="copy-line"><code id="add-cmd">Bina skill poster-agent, kemudian tambah ke Agent Studio.</code><button class="btn small" type="button" data-copy="add-cmd">Salin</button></div></div>
          <div class="field" style="margin-top:14px"><span class="lbl">Tambah style video baru (hantar 3–5 reel rujukan sekali)</span><div class="copy-line"><code id="add-style">Buat style pack baru nama NAMA-STYLE dari reel rujukan ni, kemudian tambah ke Agent Studio.</code><button class="btn small" type="button" data-copy="add-style">Salin</button></div></div></div>
          <div class="glass block"><div class="sec-head"><div><h2>Idea agent seterusnya</h2><p>Sesuai dengan workflow konten kau.</p></div></div>
          <div class="list">${ideas.map(([n, d]) => `<div class="li" style="--lc:var(--accent)"><span class="li-ic">${svg("spark", 16)}</span><div><b>${n}</b><small>${d}</small></div><span class="tag neutral">Idea</span></div>`).join("")}</div></div></section>
         <section><div class="sec-head"><div><h2>Status agent</h2></div></div><div class="agents" id="ov-agents"></div></section>`;
    }
    update();
  }

  function update() {
    renderNav();
    if (view === "overview") { renderKpis(); renderAgentCards(); renderAttention(); renderActivity(); renderWeek(); }
    else if (view === "agent-baru") renderAgentCards();
    else if (view === "video") { renderTarget(); renderStageTiles(); renderFilter(); renderVideoBoard(); if (!draft) renderDrawer(); }
    else if (AGENTS[view]) { renderTaskBoard(); if (!draft) renderDrawer(); }
    else if (view === "hooks") renderHooks();
  }

  // ---- overview parts
  function renderKpis() {
    const items = allItems(), since = periodStart();
    const active = items.filter((x) => !x.done), review = items.filter((x) => x.review);
    const doneP = items.filter((x) => x.done && (x.doneAt || 0) >= since);
    const posted = projects.filter((p) => p.stage === "posted" && (p.postedAt || 0) >= since);
    const live = Object.values(AGENTS).filter((a) => a.live).length;
    const tiles = [
      { ic: "spark", label: "Tugas aktif", num: active.length, a: ["Lewat", active.filter(isLate).length], b: ["Agent jalan", items.filter((x) => x.stage === "edit" || x.stage === "jalan").length] },
      { ic: "eye", label: "Tunggu semak", num: review.length, a: ["Video", review.filter((x) => x.kind === "video").length], b: ["Lain-lain", review.filter((x) => x.kind === "task").length] },
      { ic: "check", label: `Siap · ${PERIODS[period].toLowerCase()}`, num: doneP.length, a: ["Video posted", posted.length], b: ["Tugas lain", doneP.filter((x) => x.kind === "task").length] },
      { ic: "video", label: "Agent aktif", num: `${live}/${Object.keys(AGENTS).length}`, a: ["Dibina", live], b: ["Belum", Object.keys(AGENTS).length - live] },
    ];
    $("#ov-kpis").innerHTML = tiles.map((t) => `<article class="glass kpi"><div class="kpi-head"><span class="kpi-icon">${svg(t.ic, 17)}</span>${esc(t.label)}</div>
      <div class="kpi-num">${esc(t.num)}</div><div class="kpi-foot"><div><span>${esc(t.a[0])}</span><b>${esc(t.a[1])}</b></div><div><span>${esc(t.b[0])}</span><b>${esc(t.b[1])}</b></div></div></article>`).join("");
  }
  function renderAgentCards() {
    const items = allItems(), since = periodStart();
    $("#ov-agents").innerHTML = Object.entries(AGENTS).map(([k, a]) => {
      const mine = items.filter((x) => x.agent === k);
      return `<article class="glass agent-card" style="--ac:${a.color}">
        <div class="agent-top"><span class="agent-ic">${svg(a.icon, 20)}</span><div><h3>${esc(a.name)}</h3><span class="pill ${a.live ? "live" : "plan"}" style="margin-left:0">${a.live ? "Aktif" : "Skill belum dibina"}</span></div></div>
        <p>${esc(a.desc)}</p>
        <div class="agent-stats"><div><b>${mine.filter((x) => !x.done).length}</b><span>Aktif</span></div><div><b>${mine.filter((x) => x.review).length}</b><span>Semak</span></div><div><b>${mine.filter((x) => x.done && (x.doneAt || 0) >= since).length}</b><span>Siap</span></div></div>
        <div class="agent-actions"><a class="btn small" href="#${k}">Buka</a><button class="btn small primary" type="button" data-newfor="${k}">+ ${k === "video" ? "Video" : "Tugas"}</button></div>
      </article>`;
    }).join("");
  }
  const liRow = (x, tag) => `<button type="button" class="li" style="--lc:${itemColor(x)}" data-open="${x.kind}:${x.id}"><span class="li-ic">${svg(AGENTS[x.agent]?.icon || "spark", 16)}</span><div><b>${esc(x.title || "Tanpa tajuk")}</b><small>${esc(AGENTS[x.agent]?.short || "")} · ${esc(stageName(x))}${x.updated ? " · " + ago(x.updated) : ""}</small></div>${tag}</button>`;
  function renderAttention() {
    const l = allItems().filter((x) => isLate(x) || x.review).sort((a, b) => (isLate(b) - isLate(a)) || (a.due || "9").localeCompare(b.due || "9")).slice(0, 7);
    $("#ov-attn").innerHTML = l.length ? l.map((x) => liRow(x, isLate(x) ? `<span class="tag late">Lewat ${fmtDate(x.due)}</span>` : `<span class="tag review">Semak</span>`)).join("") : `<div class="empty">Tiada apa yang tersangkut. Bila agent hantar hasil untuk disemak, ia muncul di sini.</div>`;
  }
  function renderActivity() {
    const l = allItems().filter((x) => x.updated).sort((a, b) => b.updated - a.updated).slice(0, 7);
    $("#ov-activity").innerHTML = l.length ? l.map((x) => liRow(x, x.done ? `<span class="tag done">Siap</span>` : `<span class="tag neutral">${esc(stageName(x))}</span>`)).join("") : `<div class="empty">Belum ada aktiviti. Tekan “+ Tugas baru” untuk mula.</div>`;
  }
  function renderWeek() {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const items = allItems().filter((x) => x.due && !x.done);
    let html = "";
    for (let i = 0; i < 7; i++) {
      const d = new Date(today.getTime() + i * 864e5), key = ymd(d);
      html += `<div class="day ${i === 0 ? "today" : ""}"><div class="day-label"><span>${i === 0 ? "Hari ni" : HARI[d.getDay()].slice(0, 3)}</span><b>${d.getDate()}</b></div>
        ${items.filter((x) => x.due === key).map((x) => `<button type="button" class="day-item" style="--ic:${itemColor(x)}" data-open="${x.kind}:${x.id}">${esc(x.title)}</button>`).join("")}</div>`;
    }
    $("#ov-week").innerHTML = html;
  }

  // ---- video parts
  function renderTarget() {
    const postedWeek = projects.filter((p) => p.stage === "posted" && (p.postedAt || 0) >= startOfWeek()).length;
    const tgt = settings.weeklyTarget || 4, frac = Math.min(1, postedWeek / tgt);
    $("#v-target").innerHTML = `<svg class="ring" viewBox="0 0 96 96" role="img" aria-label="${postedWeek} daripada ${tgt} video dipost minggu ni">
        <circle cx="48" cy="48" r="40" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="9"></circle>
        <circle cx="48" cy="48" r="40" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(frac * 251.3).toFixed(1)} 251.3" transform="rotate(-90 48 48)"></circle>
        <text x="48" y="54" text-anchor="middle" fill="var(--fg)" font-size="19" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">${postedWeek}/${tgt}</text></svg>
      <div><div class="eyebrow">Sasaran minggu ni</div><h3>${postedWeek >= tgt ? "Sasaran tercapai" : `${tgt - postedWeek} lagi untuk sasaran`}</h3>
        <div class="stepper"><button type="button" data-act="tgt-" aria-label="Kurangkan sasaran">−</button><span>${tgt}</span><button type="button" data-act="tgt+" aria-label="Tambah sasaran">+</button><span class="note" style="min-width:0">reel / minggu</span></div></div>`;
  }
  function renderStageTiles() {
    $("#v-stages").innerHTML = VSTAGES.map((s) => `<button type="button" class="stage-tile" data-jumpcol="${s.id}"><span><i style="background:${s.color}"></i>${s.name}</span><b>${projects.filter((p) => p.stage === s.id).length}</b></button>`).join("");
  }
  function renderFilter() {
    const opts = [["all", "Semua"], ...Object.entries(MODES).map(([k, v]) => [k, v.name])];
    $("#v-filter").innerHTML = opts.map(([k, n]) => `<button type="button" data-filter="${k}" aria-pressed="${fmtFilter === k}">${esc(n)}</button>`).join("");
  }
  function cardHtml(x, chipsHtml, pct, meta) {
    const key = `${x.kind}:${x.id}`;
    return `<button type="button" class="card ${key === selectedKey ? "sel" : ""}" draggable="${!readOnly}" data-open="${key}" data-key="${key}">
      <div class="card-title">${esc(x.title || "Tanpa tajuk")}</div><div class="chips">${chipsHtml}${x.example ? '<span class="chip">Contoh</span>' : ""}${isLate(x) ? '<span class="chip late">Lewat</span>' : ""}</div>
      ${pct !== null ? `<div class="progress" title="Checklist ${pct}%"><i style="width:${pct}%"></i></div>` : ""}<div class="card-meta"><span>${esc(fmtDate(x.due))}</span><span>${esc(meta)}</span></div></button>`;
  }
  function boardHtml(stages, list, cardFn, emptyFirst) {
    return stages.map((s, i) => {
      const items = list.filter((x) => x.stage === s.id).sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
      return `<div class="col" data-stage="${s.id}"><div class="col-head"><span class="dot" style="background:${s.color}"></span>${s.name}<small>${items.length}</small></div>
        ${items.map(cardFn).join("")}${!items.length ? `<div class="col-hint">${i === 0 ? emptyFirst : "Kosong"}</div>` : ""}</div>`;
    }).join("");
  }
  function renderVideoBoard() {
    const list = projects.filter((p) => fmtFilter === "all" || normMode(p.mode) === fmtFilter).map((p) => ({ ...p, kind: "video", agent: "video" }));
    $("#board").innerHTML = boardHtml(VSTAGES, list, (p) => {
      const f = FORMATS[p.format] || FORMATS.education;
      return cardHtml(p, `<span class="chip k" style="--kc:var(--c-video)">${esc(MODES[normMode(p.mode)].name)}</span><span class="chip">${esc(f.name)}</span><span class="chip">${esc(STYLES[normStyle(p.style, p.format)].name)}</span>`, vCheckPct(p), (p.platforms || []).map((k) => ({ ig: "IG", tiktok: "TT", yt: "YT" }[k])).join(" · ") || "—");
    }, "Tekan “+ Video baru” untuk mula.");
  }
  function renderTaskBoard() {
    const a = AGENTS[view];
    const list = tasks.filter((t) => t.agent === view).map((t) => ({ ...t, kind: "task" }));
    $("#board").innerHTML = boardHtml(TSTAGES, list, (t) => {
      const chip = a.fields[0].options ? `<span class="chip k" style="--kc:${a.color}">${esc(lab(view, a.fields[0].k, t[a.fields[0].k]))}</span>` : "";
      return cardHtml(t, chip, tCheckPct(t), t.updated ? ago(t.updated) : "");
    }, "Tekan “+ Tugas baru” untuk brief agent.");
  }

  // ---- drawer
  function videoPrompt(p) {
    const f = FORMATS[p.format] || FORMATS.education;
    const mode = normMode(p.mode), style = normStyle(p.style, p.format);
    const lines = [`Guna skill reel-editor. Edit project CapCut "${p.capcut || "NAMA PROJECT"}", mode ${mode}, style ${style}, format ${f.cmd}, ${p.broll ? `B-roll dalam folder ${p.broll}` : "B-roll guna stok Pixabay"}. Aku guna Windows.`];
    if (mode === "faceless") lines.push(p.voice === "own" || !p.voice ? "Suara: rakaman aku sendiri dalam project tu, bersihkan dan potong jeda." : p.voice === "ai-capcut" ? "Suara: AI guna Text-to-speech CapCut (aku dah letak dalam project)." : "Suara: AI guna ElevenLabs (key dalam ELEVENLABS_API_KEY). Skrip ada dalam nota.");
    if (p.hook) lines.push(`Hook yang aku nak: "${p.hook}".`);

  const taskPrompt = (t) => { const a = AGENTS[t.agent]; let s = a.prompt(t); if (t.notes) s += `\nNota: ${t.notes}`; return s; };
  const promptFor = (d) => (d.kind === "video" ? videoPrompt(d) : taskPrompt(d));

  function renderDrawer() {

      <div class="row2"><div class="field"><label for="f-stage">Peringkat</label><select class="select" id="f-stage" data-k="stage" ${dis}>${stages.map((s) => `<option value="${s.id}" ${d.stage === s.id ? "selected" : ""}>${s.name}</option>`).join("")}</select></div>

        ${md === "faceless" ? `<div class="field"><span class="lbl">Suara</span><div class="seg">${Object.entries(VOICES).map(([k, v]) => `<button type="button" data-seg="voice" data-val="${k}" aria-pressed="${(d.voice || "own") === k}" ${dis}>${esc(v)}</button>`).join("")}</div></div>` : ""}

        <div class="row2"><div class="field"><label for="f-capcut">Nama project CapCut</label><input class="input" id="f-capcut" data-k="capcut" value="${esc(d.capcut)}" placeholder="claude test" ${dis}></div>
          <div class="field"><label for="f-style">Style</label><select class="select" id="f-style" data-k="style" ${dis}>${Object.entries(STYLES).map(([k, st]) => `<option value="${k}" ${sd === k ? "selected" : ""}>${esc(st.name)}</option>`).join("")}</select></div></div>

        <div class="field"><label for="f-broll">Folder B-roll sendiri (kosongkan untuk stok Pixabay)</label><input class="input" id="f-broll" data-k="broll" value="${esc(d.broll)}" placeholder="D:\\B-roll" ${dis}></div>
        <div class="field"><span class="lbl">Platform</span><div class="seg">${Object.entries(PLATFORMS).map(([k, v]) => `<button type="button" data-multi="platforms" data-val="${k}" aria-pressed="${(d.platforms || []).includes(k)}" ${dis}>${esc(v)}</button>`).join("")}</div></div>`;
      if (d.stage === "posted") left += `<div class="field"><span class="lbl">Prestasi (isi lepas 48 jam)</span><div class="stats">${[["views", "Views"], ["saves", "Saves"], ["shares", "Shares"], ["watch", "Tonton %"]].map(([k, n]) => `<div class="field"><label for="s-${k}">${n}</label><input class="input" type="number" min="0" id="s-${k}" data-stat="${k}" value="${esc(d.stats?.[k] ?? "")}" ${dis}></div>`).join("")}</div></div>`;
      checks = VCHECKS[d.stage] || []; ckey = (k) => `${d.stage}.${k}`;
    } else {
      for (const f of a.fields) {
        const v = d[f.k] ?? "";
        if (f.type === "seg") left += `<div class="field"><span class="lbl">${esc(f.label)}</span><div class="seg">${f.options.map(([k, n]) => `<button type="button" data-seg="${f.k}" data-val="${k}" aria-pressed="${v === k}" ${dis}>${esc(n)}</button>`).join("")}</div></div>`;
        else if (f.type === "number") left += `<div class="field"><label for="f-${f.k}">${esc(f.label)}</label><input class="input" type="number" min="0" id="f-${f.k}" data-k="${f.k}" value="${esc(v)}" ${dis}></div>`;
        else if (f.type === "creative") {
          const opts = [...projects.map((p) => `Video: ${p.title}`), ...tasks.filter((t) => t.agent === "poster").map((t) => `Poster: ${t.title}`)];
          left += `<div class="field"><label for="f-${f.k}">${esc(f.label)}</label><select class="select" id="f-${f.k}" data-k="${f.k}" ${dis}><option value="">Belum dipilih</option>${opts.map((o) => `<option ${v === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`;
        } else left += `<div class="field"><label for="f-${f.k}">${esc(f.label)}</label><input class="input" id="f-${f.k}" data-k="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph || "")}" ${dis}></div>`;
      }
      if (d.stage === "semak" || d.stage === "siap") checks = a.checks;
    }
    left += `<div class="field"><label for="f-notes">Nota untuk agent</label><textarea class="input" id="f-notes" data-k="notes" placeholder="Apa-apa yang agent perlu tahu" ${dis}>${esc(d.notes)}</textarea></div>`;
    const c = d.checks || {};
    const right = `<div class="field"><span class="lbl">Arahan untuk ${esc(a.name)}</span><div class="prompt-box" id="prompt">${esc(promptFor(d))}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn primary small" type="button" data-act="copy">Salin arahan</button><span class="note">Paste dalam chat baru di Claude desktop app.</span></div>
        ${a.live ? "" : `<div class="warn-box">Skill <b>${esc(a.skill)}</b> belum dibina, jadi arahan ni belum boleh dijalankan lagi.</div>`}</div>
      ${checks.length ? `<div class="field"><span class="lbl">Checklist · ${esc(stages.find((s) => s.id === d.stage)?.name)}</span><div class="checks">${checks.map(([k, t, sub]) => { const on = !!c[ckey(k)]; return `<label class="check ${on ? "done" : ""}"><input type="checkbox" data-check="${ckey(k)}" ${on ? "checked" : ""} ${dis}><span>${esc(t)}${sub ? `<small>${esc(sub)}</small>` : ""}</span></label>`; }).join("")}</div></div>`
        : `<div class="note">${d.stage === "edit" || d.stage === "jalan" ? "Agent sedang jalan. Bila hasil sampai, pindah ke Semak." : d.stage === "posted" ? "Isi prestasi supaya kau nampak hook dan format mana yang menang." : "Checklist muncul bila tugas sampai peringkat semak."}</div>`}`;
    el.innerHTML = `<div class="sec-head"><div><div class="eyebrow">${d.isNew ? "Baru" : "Butiran"} · ${esc(a.name)}</div><h2 style="margin-top:4px">${esc(d.title || "Tanpa tajuk")}</h2></div><button class="btn ghost small" type="button" data-act="close">Tutup</button></div>
      <div class="drawer-grid"><div class="stack">${left}</div><div class="stack">${right}</div></div>
      <div class="drawer-foot"><div>${!d.isNew && !readOnly ? `<button class="btn ghost small danger" type="button" data-act="delete">Padam</button>` : ""}</div>
        <div>${!readOnly && nextStage ? `<button class="btn small" type="button" data-act="advance">Pindah ke ${esc(nextStage.name)} →</button>` : ""}${!readOnly ? `<button class="btn primary small" type="button" data-act="save">${d.isNew ? "Tambah" : "Simpan"}</button>` : `<span class="note">Paparan baca sahaja</span>`}</div></div>`;
  }

  // ---- resources
  function renderHooks() {
    $("#formulas").innerHTML = FORMULAS.map((f, i) => `<div class="formula"><b>${esc(f.name)}</b><code>${esc(f.tpl)}</code><span class="ex-line">${esc(f.ex)}</span><div class="formula-actions"><button class="btn small ghost" type="button" data-usef="${i}">Guna formula ni</button></div></div>`).join("");
    $("#hooks").innerHTML = hooks.length ? hooks.map((h) => `<div class="hook"><div><p>${esc(h.text)}</p><small>${h.used ? `Dah guna ${h.used}×` : "Belum guna"}</small></div>
      <div style="display:flex;gap:6px"><button class="btn small" type="button" data-usehook="${h.id}">Video baru</button>${readOnly ? "" : `<button class="btn small ghost danger" type="button" data-delhook="${h.id}" aria-label="Padam hook">×</button>`}</div></div>`).join("")
      : `<div class="empty">Belum ada hook disimpan. Tulis satu di atas, atau tekan “Guna formula ni”.</div>`;
  }

  // ------------------------------------------------------------------ data ops
  const strip = (x) => { const o = { ...x }; for (const k of ["id", "isNew", "kind", "done", "review", "doneAt"]) delete o[k]; return o; };
  async function saveItem(d) {
    const body = strip(d); body.updated = Date.now();
    const isVideo = d.kind === "video";
    if (isVideo) { delete body.agent; if (body.stage === "posted" && !body.postedAt) body.postedAt = Date.now(); if (body.stage !== "posted") delete body.postedAt; }
    else { if (body.stage === "siap" && !body.doneAt) body.doneAt = Date.now(); if (body.stage !== "siap") delete body.doneAt; if (d.doneAt && body.stage === "siap") body.doneAt = d.doneAt; }
    const coll = isVideo ? "projects" : "tasks";
    if (!db) {
      const arr = isVideo ? projects : tasks;
      if (d.isNew) { const id = "m" + ++memId; arr.push({ id, ...body, created: Date.now() }); return id; }
      const i = arr.findIndex((x) => x.id === d.id); arr[i] = { id: d.id, ...body }; return d.id;
    }
    if (d.isNew) { body.created = Date.now(); const ref = await db.collection(coll).add(body); return ref.id; }
    await db.doc(`${coll}/${d.id}`).set(body); return d.id;
  }
  async function deleteItem(d) {
    const coll = d.kind === "video" ? "projects" : "tasks";
    if (!db) { if (d.kind === "video") projects = projects.filter((x) => x.id !== d.id); else tasks = tasks.filter((x) => x.id !== d.id); return; }
    await db.doc(`${coll}/${d.id}`).delete();
  }
  async function addHook(text) { if (!db) { hooks.unshift({ id: "h" + ++memId, text, used: 0, created: Date.now() }); return; } await db.collection("hooks").add({ text, used: 0, created: Date.now() }); }
  async function bumpHook(text) { const h = hooks.find((x) => x.text === text); if (!h) return; if (!db) { h.used = (h.used || 0) + 1; return; } await db.doc("hooks/" + h.id).update({ used: (h.used || 0) + 1 }); }
  async function deleteHook(id) { if (!db) { hooks = hooks.filter((h) => h.id !== id); return; } await db.doc("hooks/" + id).delete(); }
  function fail(e) {
    if (e && e.code === "invalid_argument") { readOnly = true; update(); renderDrawer(); toast("Kau tak boleh ubah data di paparan ni"); return; }
    if (e && e.code === "quota_exceeded") { toast("Storan penuh. Padam tugas lama dulu."); return; }
    toast("Tak dapat simpan. Cuba lagi sekejap.");
  }

  // ------------------------------------------------------------------ actions
  function findItem(key) {
    const [kind, id] = key.split(":");
    const x = kind === "video" ? projects.find((p) => p.id === id) : tasks.find((t) => t.id === id);
    return x ? { ...JSON.parse(JSON.stringify(x)), kind, agent: kind === "video" ? "video" : x.agent } : null;
  }
  function openItem(key) {
    const x = findItem(key); if (!x) return;
    const target = x.kind === "video" ? "video" : x.agent;
    if (view !== target) go(target);
    selectedKey = key; draft = x;
    update(); renderDrawer();
    $("#drawer")?.scrollIntoView({ behavior: "auto", block: "start" });
  }
  function newItem(agent, seed = {}) {
    if (view !== agent) go(agent);
    selectedKey = null;
    if (agent === "video") draft = { isNew: true, kind: "video", agent: "video", title: "", mode: "talking-head", format: "education", style: "authority", voice: "own", stage: "idea", capcut: "", hook: "", broll: "", notes: "", platforms: ["ig", "tiktok"], due: "", checks: {}, ...seed };
    else { draft = { isNew: true, kind: "task", agent, title: "", stage: "brief", due: "", notes: "", checks: {}, ...seed }; for (const f of AGENTS[agent].fields) if (f.def !== undefined && draft[f.k] === undefined) draft[f.k] = f.def; }
    update(); renderDrawer();
    $("#drawer")?.scrollIntoView({ behavior: "auto", block: "start" });
    setTimeout(() => $("#f-title")?.focus(), 0);
  }
  async function commit() {
    if (!draft.title.trim()) { toast("Isi tajuk dulu"); $("#f-title")?.focus(); return; }
    try {
      const wasNew = draft.isNew;
      if (draft.kind === "video" && draft.hook) await bumpHook(draft.hook).catch(() => {});
      const id = await saveItem(draft);
      selectedKey = `${draft.kind}:${id}`; draft = { ...draft, id, isNew: false };
      toast(wasNew ? "Ditambah" : "Disimpan");
      update(); renderDrawer();
    } catch (e) { fail(e); }
  }
  async function moveTo(key, stage) {
    const x = findItem(key); if (!x || x.stage === stage) return;
    try { await saveItem({ ...x, stage }); if (!db) update(); toast(`Dipindah ke ${(x.kind === "video" ? VSTAGES : TSTAGES).find((s) => s.id === stage).name}`); } catch (e) { fail(e); }
  }

  function go(v) { if (!VIEWS.includes(v)) v = "overview"; if (location.hash !== "#" + v) history.replaceState(null, "", "#" + v); view = v; closeSide(); mount(); window.scrollTo(0, 0); }
  window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v !== view) { view = VIEWS.includes(v) ? v : "overview"; closeSide(); mount(); window.scrollTo(0, 0); } });
  const openSide = () => { $("#side").classList.add("open"); $("#scrim").hidden = false; $("#close-side").hidden = false; };
  const closeSide = () => { $("#side").classList.remove("open"); $("#scrim").hidden = true; $("#close-side").hidden = true; };

  async function copyText(text, node) {
    try { await navigator.clipboard.writeText(text); toast("Disalin"); }
    catch (_) { if (node) { const r = document.createRange(); r.selectNodeContents(node); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Tekan Ctrl+C untuk salin"); }
  }

  document.addEventListener("click", async (ev) => {
    const t = ev.target.closest("button, a[href^='#'], [data-open]");
    if (!t) { if (!ev.target.closest(".search")) $("#results").hidden = true; return; }
    if (t.matches("a[href^='#']") && !t.dataset.open) { ev.preventDefault(); go(t.getAttribute("href").slice(1)); return; }
    if (t.id === "open-side") return openSide();
    if (t.id === "close-side") return closeSide();
    if (t.id === "bell") { go("overview"); setTimeout(() => $("#ov-attn")?.scrollIntoView({ behavior: "auto", block: "center" }), 0); return; }
    if (t.id === "quick-new") return newItem(AGENTS[view] ? view : "video");
    if (t.dataset.newfor) return newItem(t.dataset.newfor);
    if (t.dataset.open) { $("#results").hidden = true; $("#q").value = ""; return openItem(t.dataset.open); }
    if (t.dataset.jumpcol) { document.querySelector(`.col[data-stage="${t.dataset.jumpcol}"]`)?.scrollIntoView({ behavior: "auto", block: "nearest", inline: "center" }); return; }
    if (t.dataset.filter) { fmtFilter = t.dataset.filter; renderFilter(); renderVideoBoard(); return; }
    if (t.dataset.copy) return copyText($("#" + t.dataset.copy).textContent, $("#" + t.dataset.copy));
    if (t.dataset.usef !== undefined) { const i = $("#hook-text"); i.value = FORMULAS[+t.dataset.usef].tpl; i.focus(); return; }
    if (t.dataset.usehook) { const h = hooks.find((x) => x.id === t.dataset.usehook); return newItem("video", { hook: h?.text || "" }); }
    if (t.dataset.delhook) { try { await deleteHook(t.dataset.delhook); if (!db) update(); } catch (e) { fail(e); } return; }
    const act = t.dataset.act;
    if (act === "refresh") { update(); toast("Dikemas kini"); return; }
    if (act === "new") return newItem(view);
    if (act === "tgt-" || act === "tgt+") {
      if (readOnly) return;
      settings.weeklyTarget = Math.max(1, Math.min(21, (settings.weeklyTarget || 4) + (act === "tgt+" ? 1 : -1)));
      renderTarget(); clearTimeout(window.__tgt); window.__tgt = setTimeout(() => { if (db) db.doc("settings/main").set(settings).catch(fail); }, 600); return;
    }
    if (!draft) return;
    if (t.dataset.fmt) { draft.format = t.dataset.fmt; draft.style = FORMATS[t.dataset.fmt].style; return renderDrawer(); }
    if (t.dataset.seg) { draft[t.dataset.seg] = t.dataset.val; return renderDrawer(); }
    if (t.dataset.multi) { const s = new Set(draft[t.dataset.multi] || []); s.has(t.dataset.val) ? s.delete(t.dataset.val) : s.add(t.dataset.val); draft[t.dataset.multi] = [...s]; return renderDrawer(); }
    if (act === "close") { draft = null; selectedKey = null; update(); renderDrawer(); }
    else if (act === "save") commit();
    else if (act === "advance") { const st = draft.kind === "video" ? VSTAGES : TSTAGES; const i = st.findIndex((s) => s.id === draft.stage); draft.stage = st[Math.min(st.length - 1, i + 1)].id; await commit(); }
    else if (act === "delete") {
      if (t.dataset.confirm !== "1") { t.dataset.confirm = "1"; t.textContent = "Tekan sekali lagi untuk padam"; return; }
      try { await deleteItem(draft); draft = null; selectedKey = null; update(); renderDrawer(); toast("Dipadam"); } catch (e) { fail(e); }
    } else if (act === "copy") copyText(promptFor(draft), $("#prompt"));
  });

  document.addEventListener("input", (ev) => {
    const el = ev.target;
    if (el.id === "q") return renderSearch(el.value);
    if (!draft) return;
    if (el.dataset.k) {
      draft[el.dataset.k] = el.type === "number" ? (el.value === "" ? "" : Number(el.value)) : el.value;
      if (el.dataset.k === "stage") return renderDrawer();
      const pb = $("#prompt"); if (pb) pb.textContent = promptFor(draft);
    } else if (el.dataset.stat) draft.stats = { ...(draft.stats || {}), [el.dataset.stat]: el.value === "" ? "" : Number(el.value) };
  });
  document.addEventListener("change", (ev) => {
    const el = ev.target;
    if (el.id === "period") { period = el.value; try { localStorage.setItem("as-period", period); } catch (_) {} update(); return; }
    if (draft && el.dataset.k && el.tagName === "SELECT" && el.dataset.k !== "stage") { draft[el.dataset.k] = el.value; const pb = $("#prompt"); if (pb) pb.textContent = promptFor(draft); }
    if (!draft || !el.dataset.check) return;
    draft.checks = { ...(draft.checks || {}), [el.dataset.check]: el.checked };
    el.closest(".check").classList.toggle("done", el.checked);
    if (!draft.isNew) commit();
  });
  document.addEventListener("submit", async (ev) => {
    if (ev.target.id !== "hook-form") return;
    ev.preventDefault();
    const v = $("#hook-text").value.trim(); if (!v) return;
    if (readOnly) return toast("Paparan baca sahaja");
    try { await addHook(v); $("#hook-text").value = ""; if (!db) update(); toast("Hook disimpan"); } catch (e) { fail(e); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { $("#results").hidden = true; closeSide(); } });
  $("#scrim").addEventListener("click", closeSide);

  function renderSearch(q) {
    const r = $("#results"); q = q.trim().toLowerCase();
    if (!q) { r.hidden = true; return; }
    const hits = allItems().filter((x) => [x.title, x.capcut, x.hook, x.headline, x.product, x.notes].some((v) => String(v || "").toLowerCase().includes(q))).slice(0, 8);
    r.innerHTML = hits.length ? hits.map((x) => `<button type="button" data-open="${x.kind}:${x.id}"><span style="width:8px;height:8px;border-radius:50%;background:${itemColor(x)}"></span><span>${esc(x.title)}</span><small>${esc(AGENTS[x.agent]?.short)} · ${esc(stageName(x))}</small></button>`).join("") : `<div class="note" style="padding:10px">Tiada yang sepadan dengan “${esc(q)}”.</div>`;
    r.hidden = false;
  }

  // drag & drop
  let dragKey = null;
  document.addEventListener("dragstart", (e) => { const c = e.target.closest?.(".card"); if (!c || readOnly) return; dragKey = c.dataset.key; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragKey); });
  document.addEventListener("dragover", (e) => { const col = e.target.closest?.(".col"); if (!col || !dragKey) return; e.preventDefault(); document.querySelectorAll(".col.drop").forEach((x) => x !== col && x.classList.remove("drop")); col.classList.add("drop"); });
  document.addEventListener("dragleave", (e) => { const col = e.target.closest?.(".col"); if (col && !col.contains(e.relatedTarget)) col.classList.remove("drop"); });
  document.addEventListener("drop", (e) => { const col = e.target.closest?.(".col"); document.querySelectorAll(".col.drop").forEach((x) => x.classList.remove("drop")); if (!col || !dragKey) return; e.preventDefault(); const k = dragKey; dragKey = null; moveTo(k, col.dataset.stage); });
  document.addEventListener("dragend", () => { dragKey = null; document.querySelectorAll(".col.drop").forEach((x) => x.classList.remove("drop")); });

  // ------------------------------------------------------------------ boot
  { const h = location.hash.slice(1); view = VIEWS.includes(h) ? h : "overview"; }
  mount();

  (async () => {
    const timer = setTimeout(() => setStatus("", "Storan lambat menjawab…"), 10000);
    db = window.claude?.use ? await window.claude.use("db").catch(() => null) : null;
    if (!db) { clearTimeout(timer); setStatus("off", "Mod sementara: data tak disimpan"); return; }
    let pending = 4;
    const ready = (fromCache) => { if (fromCache) return; if (--pending <= 0) { clearTimeout(timer); setStatus("ok", "Tersimpan"); } };
    const err = () => { clearTimeout(timer); setStatus("off", "Storan terputus. Muat semula halaman."); };
    const keepDraft = () => { if (draft && !draft.isNew && !findItem(selectedKey)) { draft = null; selectedKey = null; renderDrawer(); } };
    db.collection("projects").onSnapshot((s) => { projects = s.docs.map((d) => ({ id: d.id, ...d.data() })); keepDraft(); update(); ready(s.metadata.fromCache); }, err);
    db.collection("tasks").onSnapshot((s) => { tasks = s.docs.map((d) => ({ id: d.id, ...d.data() })).filter((t) => AGENTS[t.agent] && t.agent !== "video"); keepDraft(); update(); ready(s.metadata.fromCache); }, err);
    db.collection("hooks").orderBy("created", "desc").onSnapshot((s) => { hooks = s.docs.map((d) => ({ id: d.id, ...d.data() })); update(); ready(s.metadata.fromCache); }, err);
    db.doc("settings/main").onSnapshot((s) => { if (s.exists) settings = { weeklyTarget: 4, ...s.data() }; if (view === "video") renderTarget(); ready(s.metadata.fromCache); }, err);
  })();
})();
</script>
