<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Agent Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Anton&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:ital,wght@1,600&family=EB+Garamond:wght@500&family=Montserrat:ital,wght@0,500;0,800;1,500&family=Inter:wght@500;800&family=Inter+Tight:wght@700&family=Poppins:wght@800&display=swap">
<style>
/* Layout: app shell. Fixed glass sidebar (nav grouped Utama / Agent / Sumber) + top bar (search, alerts)
   + per-view banner (title, period, refresh) + view body. Every agent shares one registry, so a new agent
   is one entry. Glass panels float over #0E0F17 with soft colour fields behind them. Single dark look by choice. */
:root {
  color-scheme: dark;
  --bg: #0e0f17;
  --glass: rgba(255, 255, 255, 0.045);
  --glass-2: rgba(255, 255, 255, 0.075);
  --glass-strong: rgba(22, 24, 36, 0.72);
  --stroke: rgba(255, 255, 255, 0.085);
  --stroke-2: rgba(255, 255, 255, 0.16);
  --fg: #eef0f7;
  --sub: #a4a9bd;
  --dim: #6c7189;
  --accent: #e58e5e;
  --accent-ink: #1b0e07;
  --accent-soft: rgba(229, 142, 94, 0.16);
  --c-video: #e58e5e;
  --c-poster: #a98bf0;
  --c-copy: #4cc9b0;
  --c-ads: #6aa6f4;
  --brand-yellow: #ffd21f;
  --good: #5fd39a;
  --warn: #f0b955;
  --bad: #f2705f;
  --font-ui: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Anton", Impact, "Arial Narrow", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r-xl: 22px;
  --r-lg: 18px;
  --r-md: 14px;
  --r-sm: 10px;
  --side-w: 248px;
  --blur: blur(22px) saturate(145%);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(520px 420px at 12% 8%, rgba(229, 142, 94, 0.20), transparent 70%),
    radial-gradient(620px 520px at 88% 14%, rgba(106, 104, 244, 0.17), transparent 70%),
    radial-gradient(560px 480px at 62% 96%, rgba(76, 201, 176, 0.11), transparent 70%),
    var(--bg);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.glass {
  background: var(--glass); border: 1px solid var(--stroke); border-radius: var(--r-xl);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 18px 40px -24px rgba(0, 0, 0, 0.7);
}

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px));
  display: flex; flex-direction: column; border-right: 1px solid var(--stroke);
  background: rgba(14, 15, 23, 0.55); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  padding: 16px 12px 14px max(12px, env(safe-area-inset-left, 0px)); z-index: 20;
}
.side-top { display: flex; align-items: center; gap: 10px; padding: 2px 6px 16px; }
.logo { display: flex; align-items: center; gap: 10px; margin-right: auto; font-weight: 800; letter-spacing: -.2px; font-size: 15.5px; }
.logo-mark {
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-family: var(--font-display);
  font-size: 15px; color: var(--accent-ink); background: linear-gradient(145deg, #f2a77b, #c4683b);
  box-shadow: 0 6px 18px -6px rgba(229, 142, 94, .7);
}
.logo small { display: block; color: var(--dim); font-weight: 600; font-size: 11px; letter-spacing: .2px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--sub);
  background: var(--glass); border: 1px solid var(--stroke); position: relative; flex: none;
}
.icon-btn:hover { color: var(--fg); border-color: var(--stroke-2); }
.icon-btn .badge {
  position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--bad); color: #fff; font-size: 10.5px; font-weight: 800; display: grid; place-items: center;
}
.nav { flex: 1; overflow-y: auto; display: grid; align-content: start; gap: 2px; padding-right: 2px; }
.nav-label { color: var(--dim); font-size: 10.5px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; padding: 14px 12px 6px; }
.nav a {
  display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
  color: var(--sub); text-decoration: none; font-weight: 600; border: 1px solid transparent;
}
.nav a:hover { color: var(--fg); background: var(--glass); }
.nav a[aria-current="page"] { color: var(--fg); background: var(--glass-2); border-color: var(--stroke); }
.nav a[aria-current="page"] svg { color: var(--nav-c, var(--accent)); }
.nav a .count { font-family: var(--font-mono); font-size: 11.5px; color: var(--dim); }
.nav a .soon { font-size: 9.5px; font-weight: 800; letter-spacing: .6px; padding: 2px 6px; border-radius: 6px; color: var(--dim); border: 1px dashed var(--dim); }
.nav .dotc { width: 8px; height: 8px; border-radius: 50%; justify-self: center; }
.side-foot { border-top: 1px solid var(--stroke); padding: 12px 8px 0; display: grid; gap: 8px; }
.status { font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 8px; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
.status.ok i { background: var(--good); }
.status.off i { background: var(--bad); }

.content { min-width: 0; display: grid; align-content: start; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; display: flex; align-items: center; gap: 10px;
  padding-block: 12px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--stroke); background: rgba(14, 15, 23, 0.6); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
}
.menu-btn { display: none; }
.search { position: relative; flex: 1; max-width: 420px; }
.search input {
  width: 100%; height: 40px; border-radius: 12px; border: 1px solid var(--stroke); background: var(--glass);
  padding: 0 14px 0 38px; color: var(--fg);
}
.search input:focus { outline: none; border-color: var(--accent); }
.search svg { position: absolute; left: 12px; top: 11px; color: var(--dim); }
.results {
  position: absolute; left: 0; right: 0; top: 46px; border-radius: var(--r-md); padding: 6px; display: grid; gap: 2px;
  background: var(--glass-strong); border: 1px solid var(--stroke-2); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  max-height: 340px; overflow-y: auto;
}
.results button { text-align: left; display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 9px; border: 0; background: transparent; }
.results button:hover, .results button:focus-visible { background: var(--glass-2); }
.results small { color: var(--dim); }
.top-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.me { display: flex; align-items: center; gap: 10px; padding-left: 8px; border-left: 1px solid var(--stroke); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: linear-gradient(145deg, #3a3f5c, #23263a); border: 1px solid var(--stroke-2); }
.me b { display: block; font-size: 13px; }
.me small { color: var(--dim); font-size: 11px; }

.page {
  display: grid; gap: 18px; padding-block: 22px 56px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  max-width: 1500px; width: 100%;
}
.page > * { min-width: 0; }

/* banner, as in the reference: icon tile + title + sub on the left, period + refresh on the right */
.banner {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 20px 22px; position: relative; overflow: hidden;
  background: linear-gradient(110deg, color-mix(in srgb, var(--bc, var(--accent)) 26%, transparent), rgba(255, 255, 255, 0.03) 55%, rgba(255, 255, 255, 0.02));
}
.banner-icon {
  width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; flex: none;
  color: var(--bc, var(--accent)); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--stroke-2);
}
.banner h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.4px; text-wrap: balance; }
.banner p { margin: 2px 0 0; color: var(--sub); }
.banner-text { flex: 1; min-width: 200px; }
.banner-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill { font-size: 10.5px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--stroke-2); color: var(--sub); vertical-align: middle; margin-left: 8px; }
.pill.live { color: var(--good); border-color: rgba(95, 211, 154, .4); background: rgba(95, 211, 154, .08); }
.pill.plan { color: var(--warn); border-color: rgba(240, 185, 85, .4); background: rgba(240, 185, 85, .08); }

.btn {
  border: 1px solid var(--stroke); background: var(--glass); color: var(--fg); border-radius: 12px; padding: 9px 15px;
  font-weight: 700; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
}
.btn:hover { border-color: var(--stroke-2); background: var(--glass-2); }
a.btn { text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 8px 22px -10px rgba(229, 142, 94, .8); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.small { padding: 6px 11px; font-size: 12.5px; border-radius: 10px; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.select, .input, textarea.input {
  width: 100%; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--stroke); border-radius: var(--r-sm); padding: 10px 12px; color: var(--fg);
}
.select option { background: #181a26; }
textarea.input { resize: vertical; min-height: 66px; }
.input:focus, .select:focus { outline: none; border-color: var(--accent); }
.banner .select { width: auto; height: 40px; padding: 0 12px; }

.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-head h2 { margin: 0; font-size: 16.5px; font-weight: 700; }
.sec-head p { margin: 2px 0 0; color: var(--dim); font-size: 12.5px; }
.block { padding: 18px 20px; }
.eyebrow { color: var(--dim); font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 800; }
.note { color: var(--dim); font-size: 12px; }
.empty { border: 1px dashed var(--stroke-2); border-radius: var(--r-md); padding: 20px; text-align: center; color: var(--sub); font-size: 13px; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { padding: 18px 20px 16px; min-width: 0; }
.kpi-head { display: flex; align-items: center; gap: 10px; color: var(--sub); font-weight: 600; }
.kpi-icon { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: rgba(255, 255, 255, .06); color: var(--accent); flex: none; border: 1px solid var(--stroke); }
.kpi-num { font-weight: 800; font-size: 40px; letter-spacing: -1.4px; margin: 14px 0 12px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi-foot { border-top: 1px solid var(--stroke); padding-top: 11px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi-foot span { display: block; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-foot b { font-size: 15.5px; font-variant-numeric: tabular-nums; }

/* agent cards */
.agents { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1250px) { .agents { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .agents { grid-template-columns: minmax(0, 1fr); } }
.agent-card { padding: 18px; display: grid; gap: 12px; align-content: start; position: relative; overflow: hidden; }
.agent-card::before { content: ""; position: absolute; inset: -40% -30% auto auto; width: 180px; height: 180px; border-radius: 50%; background: var(--ac); opacity: .16; filter: blur(30px); pointer-events: none; }
.agent-top { display: flex; align-items: center; gap: 12px; }
.agent-ic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: var(--ac); background: rgba(255, 255, 255, .06); border: 1px solid var(--stroke-2); flex: none; }
.agent-card h3 { margin: 0; font-size: 15px; }
.agent-card p { margin: 0; color: var(--sub); font-size: 12.5px; }
.agent-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.agent-stats div { background: rgba(255, 255, 255, .04); border: 1px solid var(--stroke); border-radius: 11px; padding: 8px 10px; }
.agent-stats b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.agent-stats span { color: var(--dim); font-size: 11px; }
.agent-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.agent-card.add { border-style: dashed; place-content: center; text-align: center; color: var(--sub); min-height: 200px; }

.two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 1000px) { .two { grid-template-columns: minmax(0, 1fr); } }
.list { display: grid; gap: 6px; }
.li {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 13px;
  background: rgba(255, 255, 255, .035); border: 1px solid var(--stroke); text-align: left; width: 100%;
}
.li:hover { border-color: var(--stroke-2); }
.li-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--lc); background: rgba(255, 255, 255, .06); }
.li b { display: block; font-size: 13.5px; overflow-wrap: anywhere; }
.li small { color: var(--dim); font-size: 12px; }
.li .tag { font-size: 10.5px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.tag.late { color: var(--bad); background: rgba(242, 112, 95, .12); }
.tag.review { color: var(--warn); background: rgba(240, 185, 85, .12); }
.tag.done { color: var(--good); background: rgba(95, 211, 154, .12); }
.tag.neutral { color: var(--sub); background: rgba(255, 255, 255, .06); }

.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.days-scroll { overflow-x: auto; }
@media (max-width: 760px) { .days { grid-template-columns: repeat(7, minmax(96px, 1fr)); } }
.day { background: rgba(255, 255, 255, .035); border: 1px solid var(--stroke); border-radius: var(--r-md); padding: 10px; min-height: 96px; display: grid; align-content: start; gap: 6px; }
.day.today { border-color: var(--accent); background: var(--accent-soft); }
.day-label { display: flex; justify-content: space-between; color: var(--sub); font-size: 11px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; }
.day-label b { color: var(--fg); font-family: var(--font-mono); }
.day-item { font-size: 12px; padding: 5px 7px; border-radius: 7px; background: rgba(255, 255, 255, .06); border: 0; border-left: 3px solid var(--ic, var(--accent)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; color: var(--fg); }

/* board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(214px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.col { background: rgba(255, 255, 255, .03); border: 1px solid var(--stroke); border-radius: var(--r-lg); padding: 10px; display: grid; align-content: start; gap: 8px; min-height: 190px; }
.col.drop { outline: 2px dashed var(--accent); outline-offset: -4px; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px; font-weight: 700; font-size: 13px; }
.col-head .dot { width: 8px; height: 8px; border-radius: 50%; }
.col-head small { margin-left: auto; color: var(--dim); font-family: var(--font-mono); }
.col-hint { color: var(--dim); font-size: 12px; padding: 4px 6px; }
.card {
  background: rgba(255, 255, 255, .055); border: 1px solid var(--stroke); border-radius: 13px; padding: 11px 12px;
  display: grid; gap: 8px; text-align: left; color: var(--fg); width: 100%;
}
.card:hover { border-color: var(--stroke-2); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.card-title { font-weight: 700; font-size: 13.5px; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 10.5px; font-weight: 800; letter-spacing: .5px; padding: 3px 8px; border-radius: 999px; background: rgba(255, 255, 255, .06); color: var(--sub); text-transform: uppercase; }
.chip.k { color: var(--kc, var(--accent)); background: color-mix(in srgb, var(--kc, var(--accent)) 16%, transparent); }
.chip.late { color: var(--bad); background: rgba(242, 112, 95, .12); }
.card-meta { display: flex; justify-content: space-between; color: var(--dim); font-size: 11.5px; gap: 8px; }
.progress { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--stroke); background: rgba(255, 255, 255, .04); color: var(--sub); padding: 7px 12px; border-radius: 999px; font-weight: 700; font-size: 12.5px; }
.seg button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* video top row */
.vtop { display: grid; grid-template-columns: minmax(250px, .9fr) minmax(0, 2fr); gap: 14px; }
@media (max-width: 1000px) { .vtop { grid-template-columns: minmax(0, 1fr); } }
.target { padding: 16px 18px; display: grid; grid-template-columns: 92px 1fr; gap: 16px; align-items: center; }
.ring { width: 92px; height: 92px; }
.target h3 { margin: 4px 0 6px; font-size: 15px; }
.stepper { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; }
.stepper button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--stroke); background: var(--glass); }
.stepper span { min-width: 24px; text-align: center; font-family: var(--font-mono); }
.stages { padding: 14px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 700px) { .stages { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.stage-tile { background: rgba(255, 255, 255, .04); border: 1px solid var(--stroke); border-radius: 13px; padding: 10px 12px; text-align: left; color: var(--fg); }
.stage-tile:hover { border-color: var(--stroke-2); }
.stage-tile span { display: flex; align-items: center; gap: 6px; color: var(--sub); font-size: 11.5px; font-weight: 700; }
.stage-tile i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.stage-tile b { display: block; font-size: 22px; margin-top: 4px; font-variant-numeric: tabular-nums; }

/* drawer */
.drawer { padding: 18px 20px 20px; display: grid; gap: 16px; }
.drawer-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 1000px) { .drawer-grid { grid-template-columns: minmax(0, 1fr); } }
.stack { display: grid; gap: 12px; align-content: start; min-width: 0; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > label, .field > .lbl { color: var(--sub); font-size: 12px; font-weight: 700; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .row2 { grid-template-columns: 1fr; } }
.checks { display: grid; gap: 6px; }
.check { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; padding: 9px 10px; border-radius: var(--r-sm); background: rgba(255, 255, 255, .04); border: 1px solid var(--stroke); cursor: pointer; }
.check input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--accent); }
.check span { font-size: 13px; }
.check small { display: block; color: var(--dim); font-size: 11.5px; }

        : `<div class="note">${d.stage === "render" || d.stage === "jalan" ? "Agent sedang jalan. Bila hasil sampai, pindah ke Semak." : d.stage === "posted" ? "Isi prestasi supaya kau nampak hook dan format mana yang menang." : "Checklist muncul bila tugas sampai peringkat semak."}</div>`}`;
    el.innerHTML = `<div class="sec-head"><div><div class="eyebrow">${d.isNew ? "Baru" : "Butiran"} · ${esc(a.name)}</div><h2 style="margin-top:4px">${esc(d.title || "Tanpa tajuk")}</h2></div><button class="btn ghost small" type="button" data-act="close">Tutup</button></div>
      <div class="drawer-grid"><div class="stack">${left}</div><div class="stack">${right}</div></div>
      <div class="drawer-foot"><div>${!d.isNew && !readOnly ? `<button class="btn ghost small danger" type="button" data-act="delete">Padam</button>` : ""}</div>
        <div>${!readOnly && nextStage ? `<button class="btn small" type="button" data-act="advance">Pindah ke ${esc(nextStage.name)} →</button>` : ""}${!readOnly ? `<button class="btn primary small" type="button" data-act="save">${d.isNew ? "Tambah" : "Simpan"}</button>` : `<span class="note">Paparan baca sahaja</span>`}</div></div>`;

  }

  // ------------------------------------------------------------------ result preview + approve -> caption -> Zernio post
  // Claude uploads the 720p phone copy to this page's asset store and writes its url to projects/<id>.preview.
  // Zernio accounts are written by Claude to settings/main.zernio = [{id, platform, username}].
  const ZPLAT = { instagram: "Instagram", tiktok: "TikTok", youtube: "YouTube", facebook: "Facebook", threads: "Threads" };
  // Footage folders on D: (Claude scans with tools/agent-studio/scan_footage.py -> settings/main.folders)
  function folderPicker(d, dis) {
    const fs = Array.isArray(settings.folders) ? settings.folders : [];
    if (!fs.length) return "";
    const groups = {};
    for (const f of fs) { const top = f.label.split(" › ")[0].replace(/ \(.*$/, ""); (groups[top] = groups[top] || []).push(f); }
    const known = fs.some((f) => f.path === d.source);
    return `<div class="field"><label for="f-folder">Pilih folder footage (dari D:)</label><select class="select" id="f-folder" ${dis}>
      <option value="">${d.source && !known ? "Lain: " + esc(d.source) : "— Pilih folder —"}</option>
      ${Object.entries(groups).map(([g, list]) => `<optgroup label="${esc(g)}">${list.map((f) => `<option value="${esc(f.path)}" ${f.path === d.source ? "selected" : ""}>${esc(f.label.includes(" › ") ? f.label.split(" › ").slice(1).join(" › ") : f.label)}</option>`).join("")}</optgroup>`).join("")}
    </select><span class="note">Tiada dalam senarai? Taip atau cerita dalam ruangan Footage di bawah. Senarai dikemas kini ${esc(settings.foldersAt || "")}.</span></div>`;
  }
  function videoPanel(d, dis) {
    const acc = Array.isArray(settings.zernio) ? settings.zernio : [];
    const sel = d.zAccounts || [];
    const canPost = d.approved && (d.caption || "").trim() && sel.length && (d.postWhen !== "jadual" || d.postAt);
    const posted = Array.isArray(d.posts) && d.posts.length;
    let h = `<div class="field"><span class="lbl">Hasil</span>${d.preview
      ? `<video src="${esc(d.preview)}" controls playsinline preload="metadata" style="width:100%;max-height:480px;border-radius:12px;background:#000;border:1px solid var(--stroke)"></video>`
      : `<div class="empty">Belum ada preview. Lepas render, Claude muat naik versi telefon ke sini.</div>`}
      ${d.review && /^https:\/\/claude\.ai\//.test(d.review) ? `<a class="btn small" href="${esc(d.review)}" target="_blank" rel="noopener" style="justify-self:start">${svg("eye", 14)} Buka semakan (komen ikut saat)</a>` : ""}</div>`;
    if (["semak", "final", "posted"].includes(d.stage) || d.approved) {
      h += `<div class="field"><span class="lbl">Workflow post</span><div class="checks">
        <div class="check ${d.approved ? "done" : ""}" style="cursor:default"><span>${svg("check", 14)}</span><span>1. Lulus video${d.approved ? ` <small>Diluluskan ${esc(fmtDate(ymd(new Date(d.approvedAt || Date.now()))))}</small>` : `<small>Tonton hasil di atas dulu</small>`}</span></div></div>
        ${!d.approved && !dis ? `<button class="btn primary small" type="button" data-act="approve" style="justify-self:start">${svg("check", 14)} Lulus video ni</button>` : ""}</div>`;
      if (d.approved) {
        h += `<div class="field"><label for="f-caption">2. Caption post</label><textarea class="input" id="f-caption" data-k="caption" rows="6" placeholder="Tekan Jana caption, atau tulis sendiri" ${dis}>${esc(d.caption)}</textarea>
            <div class="copy-line"><button class="btn small" type="button" data-send="caption" ${dis}>${svg("spark", 14)} ${d.caption ? "Jana semula caption" : "Jana caption"}</button><span class="note">Claude tulis caption + hashtag dan isi kotak ni.</span></div></div>
          <div class="field"><span class="lbl">3. Akaun Zernio</span>${acc.length ? `<div class="seg">${acc.map((x) => `<button type="button" data-multi="zAccounts" data-val="${esc(x.id)}" aria-pressed="${sel.includes(x.id)}" ${dis}>${esc(ZPLAT[x.platform] || x.platform)} · @${esc(x.username)}</button>`).join("")}</div>`
            : `<div class="note">Belum ada senarai akaun. Tekan Jana caption dan Claude akan isi akaun Zernio kau.</div>`}</div>
          <div class="field"><span class="lbl">4. Bila</span><div class="seg"><button type="button" data-seg="postWhen" data-val="sekarang" aria-pressed="${d.postWhen !== "jadual"}" ${dis}>Sekarang</button><button type="button" data-seg="postWhen" data-val="jadual" aria-pressed="${d.postWhen === "jadual"}" ${dis}>Jadual</button></div>
            ${d.postWhen === "jadual" ? `<input class="input" type="datetime-local" data-k="postAt" value="${esc(d.postAt)}" ${dis}>` : ""}</div>
          <div class="field">${posted ? `<div class="note">Dah dipost: ${d.posts.map((p) => esc(`${ZPLAT[p.platform] || p.platform}${p.when ? " · " + p.when : ""}`)).join(", ")}</div>` : ""}
            <div class="copy-line"><button class="btn primary small" type="button" data-send="post" ${canPost && !dis ? "" : "disabled"}>${svg("ads", 14)} Post guna Zernio</button><span class="note">${canPost ? "Claude upload video, kemudian sahkan dengan kau sekali sebelum post." : "Perlu: lulus, caption, sekurang-kurangnya satu akaun" + (d.postWhen === "jadual" ? ", masa" : "") + "."}</span></div></div>`;
      }
    }
    return h;
  }
  function sendText(kind, d) {
    const acc = (Array.isArray(settings.zernio) ? settings.zernio : []).filter((x) => (d.zAccounts || []).includes(x.id));
    const base = `Projek Agent Studio projects/${d.id} "${d.title}" (siri ${d.series || "-"}, fail final ${d.finalDir || "-"}).`;
    if (kind === "caption") return `[Agent Studio · Jana caption]\n${base}\nTulis caption post untuk ${(d.platforms || []).map((p) => PLATFORMS[p]).join(", ") || "Instagram dan TikTok"}: baris pertama hook, 2-4 ayat santai ikut isi reel (baca transkrip), satu CTA, 3-6 hashtag. Hook video: ${d.hook || "-"}.\nSimpan dalam db projects/${d.id} medan "caption" guna ArtifactData. Kalau settings/main belum ada "zernio", isi senarai akaun Zernio [{id, platform, username}]. Balas ringkas di sini.`;
    return `[Agent Studio · Post guna Zernio]\n${base}\nVideo dah diluluskan. Akaun: ${acc.map((x) => `${x.platform} @${x.username} (${x.id})`).join(", ") || "-"}.\nBila: ${d.postWhen === "jadual" ? `jadual ${d.postAt}` : "sekarang"}.\nCaption:\n${d.caption || "-"}\nLangkah: cari fail final versi penuh dalam ${d.finalDir || "folder final"}, upload ke Zernio (presigned URL), sahkan dengan aku sekali (akaun, caption, masa) sebelum post, kemudian posts_create. Lepas berjaya, kemas kini projects/${d.id}: stage "posted", posts [{platform, id, when}].`;
  }

  // ------------------------------------------------------------------ send to Claude (artifact comments)
  // The instruction is posted as a comment on this page and handed to the Claude session watching it;
  // Claude replies in that comment thread.
  let cm = null, cmTried = false;
  const SEND_WHY = { writers_only: "Hanya editor studio boleh hantar.", no_session: "Tiada sesi Claude yang memantau studio ni sekarang. Buka chat Claude Code projek VIDEOEDITOR dulu, kemudian cuba lagi.", off: "Hantar ke Claude tak ada dalam paparan ni. Guna Salin." };
  async function refreshSend() {
    const b = $("#send-btn"), n = $("#send-note");
    if (!b || !n) return;
    if (!cmTried) { cmTried = true; cm = window.claude?.use ? await window.claude.use("comments").catch(() => null) : null; }
    let st = "off";
    if (cm) { try { st = await cm.canSendToClaude(); } catch (_) { st = "off"; } }
    const ok = st === "available";
    if (!$("#send-btn")) return;
    b.disabled = !ok;
    n.textContent = ok ? "Claude terima terus dan balas dalam komen halaman ni." : (SEND_WHY[st] || SEND_WHY.off);
  }
  async function sendToClaude(kind, btn) {
    const b = btn || $("#send-btn"), n = $("#send-note") || { set textContent(_) {} };
    if (!draft) return;
    if (!cm) { toast("Hantar ke Claude tak ada dalam paparan ni"); return; }
    if (kind && (draft.isNew || !draft.id)) { toast("Simpan video ni dulu"); return; }
    const extra = ($("#f-extra")?.value || "").trim();
    let text = kind ? sendText(kind, draft) : `[Agent Studio · ${AGENTS[draft.agent]?.name || "Agent"} · ${draft.title || "Tanpa tajuk"}]\n${promptFor(draft)}${extra ? `\n\nArahan tambahan: ${extra}` : ""}`;
    text = text.replace(new RegExp("[\u0000-\u0009\u000b-\u001f\u007f\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]", "g"), " ");
    while (new TextEncoder().encode(text).length > 3900) text = text.slice(0, -50);
    b.disabled = true; n.textContent = "Menghantar…";
    try {
      const anchor = await cm.anchorFor($("#prompt"));
      try { await cm.sendToClaude({ anchor, text }); }
      catch (e) { if (e?.code !== "invalid") throw e; await cm.sendToClaude({ anchor, text: text.replace(/\n+/g, " · ") }); }
      if ($("#f-extra") && !kind) $("#f-extra").value = "";
      n.textContent = "Dihantar. Balasan Claude muncul dalam komen halaman ni.";
      toast(kind === "caption" ? "Diminta: caption" : kind === "post" ? "Diminta: post. Claude akan sahkan dulu." : "Dihantar ke Claude");
      if (kind && !readOnly) saveItem(draft).catch(() => {});
    } catch (e) {
      const why = { claude_unavailable: "Claude tak dapat terima sekarang. Pastikan chat Claude Code projek ni terbuka.", rate_limited: "Terlalu cepat. Tunggu sekejap.", consent_required: "Benarkan komen dulu, kemudian cuba lagi.", forbidden: SEND_WHY.writers_only };
      n.textContent = why[e?.code] || "Tak berjaya hantar. Guna Salin sebagai ganti.";
      if (kind) toast(why[e?.code] || "Tak berjaya hantar");
      if (btn) btn.disabled = false;
    } finally { setTimeout(refreshSend, 1500); }
  }

  // ------------------------------------------------------------------ Jadual Post (finished videos -> 3 captions -> pick -> Zernio schedule)
  // Data: db autopost/<id> = {title, link, note, zAccounts[], postAt "YYYY-MM-DDTHH:mm" (Asia/Kuala_Lumpur), captions[3], pick, caption,
  //   status baru|pilih|jadual|posted|gagal, waiting caption|jadual|batal|null, zernioPostId, error, posts[{platform,url}]}.
  // Claude writes captions/status/zernioPostId with ArtifactData (skill autopost-zernio).
  const APCOLS = [
    { id: "baru", name: "Perlu caption", color: "#8a8fa6" }, { id: "pilih", name: "Pilih caption", color: "#f0b955" },
    { id: "jadual", name: "Dijadualkan", color: "#6aa6f4" }, { id: "posted", name: "Dah keluar", color: "#5fd39a" },
  ];
  const AP_WAIT = { caption: "Claude sedang tulis caption", jadual: "Claude sedang jadualkan", batal: "Claude sedang batalkan", sync: "Claude sedang semak" };
  const apCol = (x) => (x.status === "gagal" ? "jadual" : APCOLS.some((c) => c.id === x.status) ? x.status : "baru");
  const fmtWhen = (s) => { if (!s) return "Belum ada masa"; const d = new Date(s); if (isNaN(d)) return s; return `${HARI[d.getDay()].slice(0, 3)} ${d.getDate()} ${BULAN[d.getMonth()]} · ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const zAcc = () => (Array.isArray(settings.zernio) ? settings.zernio : []);
  const accLabel = (id) => { const a = zAcc().find((x) => x.id === id); return a ? `${ZPLAT[a.platform] || a.platform} @${a.username}` : id; };
  const apNeedsAction = () => autoposts.filter((x) => (x.status === "baru" || x.status === "pilih" || x.status === "gagal") && !x.waiting).length;
  function apGate(d) {
    const miss = [];
    if (d.isNew || !d.id) miss.push("simpan dulu");
    if (!(d.link || "").trim()) miss.push("link video");
    if (!(d.caption || "").trim()) miss.push("caption");
    if (!(d.zAccounts || []).length) miss.push("akaun");
    if (!d.postAt) miss.push("masa");
    else if (new Date(d.postAt).getTime() < Date.now() + 5 * 6e4) miss.push("masa yang belum lepas");
    if (d.status === "jadual" || d.status === "posted") miss.push("video ni belum dijadualkan");
    return miss;
  }
  function renderJadual() { renderApStages(); renderApWeek(); renderApBoard(); }
  function renderApStages() {
    const el = $("#ap-stages"); if (!el) return;
    el.innerHTML = APCOLS.map((c) => `<button class="stage-tile" type="button" data-jumpcol="ap-${c.id}"><span><i style="background:${c.color}"></i>${c.name}</span><b>${autoposts.filter((x) => apCol(x) === c.id).length}</b></button>`).join("");
  }
  function renderApWeek() {
    const el = $("#ap-week"); if (!el) return;
    const start = new Date(); start.setHours(0, 0, 0, 0);
    let h = "";
    for (let i = 0; i < 7; i++) {
      const d = new Date(start.getTime() + i * 864e5), key = ymd(d);
      const its = autoposts.filter((x) => x.postAt && x.postAt.slice(0, 10) === key && x.status !== "baru").sort((a, b) => a.postAt.localeCompare(b.postAt));
      h += `<div class="day ${i === 0 ? "today" : ""}"><div class="day-label">${HARI[d.getDay()].slice(0, 3)} <b>${d.getDate()}</b></div>${its.map((x) => `<button class="day-item" type="button" data-ap-open="${esc(x.id)}" style="--ic:${(APCOLS.find((c) => c.id === apCol(x)) || APCOLS[0]).color}" title="${esc(x.title)}">${esc(x.postAt.slice(11, 16))} ${esc(x.title)}</button>`).join("")}</div>`;
    }
    el.innerHTML = h;
  }
  function renderApBoard() {
    const el = $("#ap-board"); if (!el) return;
    const sel = apDraft && !apDraft.isNew ? apDraft.id : null;
    el.innerHTML = APCOLS.map((c) => {
      const its = autoposts.filter((x) => apCol(x) === c.id).sort((a, b) => (a.postAt || "9").localeCompare(b.postAt || "9"));
      return `<div class="col" data-stage="ap-${c.id}"><div class="col-head"><span class="dot" style="background:${c.color}"></span>${c.name}<small>${its.length}</small></div>
        ${its.length ? its.map((x) => `<button class="card ${x.id === sel ? "sel" : ""}" type="button" data-ap-open="${esc(x.id)}">
          <span class="card-title">${esc(x.title || "Tanpa tajuk")}</span>
          <span class="chips">${(x.zAccounts || []).map((a) => { const z = zAcc().find((q) => q.id === a); return `<span class="chip">${esc(z ? (ZPLAT[z.platform] || z.platform) : "Akaun")}</span>`; }).join("")}
            ${x.waiting ? `<span class="chip k" style="--kc:var(--accent)">${esc(AP_WAIT[x.waiting] || "Menunggu Claude")}</span>` : ""}
            ${x.status === "gagal" ? `<span class="chip late">Gagal</span>` : ""}</span>
          <span class="card-meta"><span>${svg("clock", 12)} ${esc(fmtWhen(x.postAt))}</span><span>${x.captions && x.captions.length ? `${x.captions.length} caption` : ""}</span></span></button>`).join("")
          : `<div class="col-hint">${c.id === "baru" ? "Tambah video siap atau import folder Drive." : "Kosong"}</div>`}</div>`;
    }).join("");
  }
  function apSummary(d) {
    const miss = apGate(d);
    return `<div class="ap-summary" id="ap-sum"><span><b>Akaun:</b> ${(d.zAccounts || []).length ? esc(d.zAccounts.map(accLabel).join(", ")) : "belum dipilih"}</span>
      <span><b>Masa:</b> ${esc(fmtWhen(d.postAt))} (waktu Malaysia)</span>
      <span><b>Caption:</b> ${d.caption ? esc(d.caption.split("\n")[0].slice(0, 90)) + (d.caption.length > 90 ? "…" : "") : "belum dipilih"}</span>
      ${miss.length ? `<span class="note">Perlu: ${esc(miss.join(", "))}.</span>` : `<span class="note">Butang di bawah ialah pengesahan kau. Claude terus jadualkan dalam Zernio.</span>`}</div>`;
  }
  function renderApDrawer() {
    const el = $("#ap-drawer"); if (!el) return;
    if (!apDraft) { el.hidden = true; el.innerHTML = ""; return; }
    const d = apDraft, dis = readOnly ? "disabled" : "", acc = zAcc(), sel = d.zAccounts || [];
    const locked = d.status === "jadual" || d.status === "posted";
    const caps = Array.isArray(d.captions) ? d.captions : [];
    el.hidden = false;
    el.innerHTML = `<div class="sec-head"><div><div class="eyebrow">Jadual Post</div><h2>${d.isNew ? "Video siap baru" : esc(d.title || "Tanpa tajuk")}</h2>
        <p>${d.isNew ? "Isi link video dan simpan. Lepas tu minta Claude tulis 3 caption." : esc((APCOLS.find((c) => c.id === apCol(d)) || {}).name || "")}${d.waiting ? " · " + esc(AP_WAIT[d.waiting] || "") : ""}</p></div>
        <button class="icon-btn" type="button" data-act="ap-close" aria-label="Tutup">${svg("plus", 16).replace("<svg", '<svg style="transform:rotate(45deg)"')}</button></div>
      ${d.status === "gagal" ? `<div class="warn-box">Gagal: ${esc(d.error || "Zernio tak dapat post video ni.")} Betulkan dan tekan Jadualkan semula, atau minta Claude cuba lagi.</div>` : ""}
      <div class="drawer-grid"><div class="stack">
        <div class="field"><label for="f-ap-title">Tajuk</label><input class="input" id="f-ap-title" data-apk="title" value="${esc(d.title)}" placeholder="Contoh: NEW ERA content 8" ${dis}></div>
        <div class="field"><label for="f-ap-link">Link video (Google Drive)</label><input class="input" id="f-ap-link" data-apk="link" value="${esc(d.link)}" placeholder="https://drive.google.com/file/d/…" ${dis} ${locked ? "readonly" : ""}>
          <span class="note">Fail mesti dikongsi "Anyone with the link". Zernio salin video ke storan dia masa dijadualkan.</span></div>
        <div class="field"><label for="f-ap-note">Konteks untuk caption (pilihan)</label><textarea class="input" id="f-ap-note" data-apk="note" rows="3" placeholder="Contoh: promo event 28 Nov, CTA link di bio, jangan sebut harga" ${dis}>${esc(d.note)}</textarea></div>
        <div class="field"><span class="lbl">Akaun</span>${acc.length ? `<div class="seg">${acc.map((x) => `<button type="button" data-ap-multi="${esc(x.id)}" aria-pressed="${sel.includes(x.id)}" ${dis || (locked ? "disabled" : "")}>${esc(ZPLAT[x.platform] || x.platform)} · @${esc(x.username)}</button>`).join("")}</div>`
          : `<div class="note">Belum ada senarai akaun Zernio. Tekan Jana 3 caption dan Claude akan isi senarai akaun.</div>`}
          <span class="note">Facebook dapat post IG melalui kongsi automatik Instagram.</span></div>
        <div class="field"><label for="f-ap-when">Masa post (waktu Malaysia)</label><input class="input" type="datetime-local" id="f-ap-when" data-apk="postAt" value="${esc(d.postAt)}" ${dis} ${locked ? "readonly" : ""}></div>
      </div><div class="stack">
        <div class="field"><span class="lbl">Pilih caption</span>${caps.length ? `<div class="ap-opts">${caps.map((c, i) => `<button class="ap-opt" type="button" data-ap-pick="${i}" aria-pressed="${d.pick === i}" ${dis || (locked ? "disabled" : "")}><span class="ap-letter">${"ABC"[i] || i + 1}</span><span>${esc(c)}</span></button>`).join("")}</div>`
          : `<div class="empty">${d.waiting === "caption" ? "Claude sedang tengok video dan tulis 3 caption. Ia muncul di sini sendiri." : "Belum ada caption. Simpan, kemudian tekan Jana 3 caption."}</div>`}
          <div class="copy-line"><button class="btn small" type="button" data-ap-send="caption" ${dis || (locked || !(d.link || "").trim() ? "disabled" : "")}>${svg("spark", 14)} ${caps.length ? "Jana semula 3 caption" : "Jana 3 caption"}</button></div></div>
        <div class="field"><label for="f-ap-caption">Caption akhir (boleh ubah)</label><textarea class="input" id="f-ap-caption" data-apk="caption" rows="7" placeholder="Pilih A, B atau C di atas, atau tulis sendiri" ${dis} ${locked ? "readonly" : ""}>${esc(d.caption)}</textarea></div>
        ${apSummary(d)}
        ${d.zernioPostId ? `<div class="note">Post Zernio: <code>${esc(d.zernioPostId)}</code></div>` : ""}
        ${Array.isArray(d.posts) && d.posts.length ? `<div class="links">${d.posts.filter((p) => /^https:\/\//.test(p.url || "")).map((p) => `<a class="btn small" href="${esc(p.url)}" target="_blank" rel="noopener">${svg("link", 14)} ${esc(ZPLAT[p.platform] || p.platform)}</a>`).join("")}</div>` : ""}
      </div></div>
      <div class="drawer-foot"><div>

    const v = $("#hook-text").value.trim(); if (!v) return;
    if (readOnly) return toast("Paparan baca sahaja");
    try { await addHook(v); $("#hook-text").value = ""; if (!db) update(); toast("Hook disimpan"); } catch (e) { fail(e); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { $("#results").hidden = true; closeSide(); } });
  $("#scrim").addEventListener("click", closeSide);

  function renderSearch(q) {
    const r = $("#results"); q = q.trim().toLowerCase();
    if (!q) { r.hidden = true; return; }
    const hits = allItems().filter((x) => [x.title, x.capcut, x.hook, x.headline, x.product, x.notes].some((v) => String(v || "").toLowerCase().includes(q))).slice(0, 8);
    r.innerHTML = hits.length ? hits.map((x) => `<button type="button" data-open="${x.kind}:${x.id}"><span style="width:8px;height:8px;border-radius:50%;background:${itemColor(x)}"></span><span>${esc(x.title)}</span><small>${esc(AGENTS[x.agent]?.short)} · ${esc(stageName(x))}</small></button>`).join("") : `<div class="note" style="padding:10px">Tiada yang sepadan dengan “${esc(q)}”.</div>`;
    r.hidden = false;
  }

  // drag & drop
  let dragKey = null;
  document.addEventListener("dragstart", (e) => { const c = e.target.closest?.(".card"); if (!c || readOnly) return; dragKey = c.dataset.key; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragKey); });
  document.addEventListener("dragover", (e) => { const col = e.target.closest?.(".col"); if (!col || !dragKey) return; e.preventDefault(); document.querySelectorAll(".col.drop").forEach((x) => x !== col && x.classList.remove("drop")); col.classList.add("drop"); });
  document.addEventListener("dragleave", (e) => { const col = e.target.closest?.(".col"); if (col && !col.contains(e.relatedTarget)) col.classList.remove("drop"); });
  document.addEventListener("drop", (e) => { const col = e.target.closest?.(".col"); document.querySelectorAll(".col.drop").forEach((x) => x.classList.remove("drop")); if (!col || !dragKey) return; e.preventDefault(); const k = dragKey; dragKey = null; moveTo(k, col.dataset.stage); });
  document.addEventListener("dragend", () => { dragKey = null; document.querySelectorAll(".col.drop").forEach((x) => x.classList.remove("drop")); });

  // ------------------------------------------------------------------ boot
  { const h = location.hash.slice(1); view = VIEWS.includes(h) ? h : "overview"; }
  mount();

  (async () => {
    const timer = setTimeout(() => setStatus("", "Storan lambat menjawab…"), 10000);
    db = window.claude?.use ? await window.claude.use("db").catch(() => null) : null;
    if (!db) { clearTimeout(timer); setStatus("off", "Mod sementara: data tak disimpan"); return; }
    let pending = 5;
    const ready = (fromCache) => { if (fromCache) return; if (--pending <= 0) { clearTimeout(timer); setStatus("ok", "Tersimpan"); } };
    const err = () => { clearTimeout(timer); setStatus("off", "Storan terputus. Muat semula halaman."); };
    const keepDraft = () => { if (draft && !draft.isNew && !findItem(selectedKey)) { draft = null; selectedKey = null; renderDrawer(); } };
    const syncDraft = () => {               // pull fields Claude writes (preview, caption, posts) into the open drawer
      if (!draft || draft.kind !== "video" || draft.isNew) return;
      const x = projects.find((p) => p.id === draft.id); if (!x) return;
      let changed = false;
      for (const k of ["preview", "posts", "stage"]) if (JSON.stringify(x[k]) !== JSON.stringify(draft[k]) && x[k] !== undefined) { draft[k] = x[k]; changed = true; }
      if (x.caption && x.caption !== draft.caption && document.activeElement?.id !== "f-caption") { draft.caption = x.caption; changed = true; }
      if (changed) renderDrawer();
    };
    db.collection("projects").onSnapshot((s) => { projects = s.docs.map((d) => { const x = { id: d.id, ...d.data() }; x.stage = normStage(x.stage); return x; }); keepDraft(); syncDraft(); update(); ready(s.metadata.fromCache); }, err);
    db.collection("tasks").onSnapshot((s) => { tasks = s.docs.map((d) => ({ id: d.id, ...d.data() })).filter((t) => AGENTS[t.agent] && t.agent !== "video"); keepDraft(); update(); ready(s.metadata.fromCache); }, err);
    db.collection("hooks").orderBy("created", "desc").onSnapshot((s) => { hooks = s.docs.map((d) => ({ id: d.id, ...d.data() })); update(); ready(s.metadata.fromCache); }, err);
    db.collection("autopost").onSnapshot((s) => {
      autoposts = s.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (apDraft && !apDraft.isNew) {
        const x = autoposts.find((p) => p.id === apDraft.id);
        if (!x) apDraft = null;
        else {
          let changed = false;
          for (const k of ["captions", "status", "waiting", "zernioPostId", "error", "posts"]) if (JSON.stringify(x[k]) !== JSON.stringify(apDraft[k])) { apDraft[k] = x[k]; changed = true; }
          if (x.caption && x.caption !== apDraft.caption && document.activeElement?.id !== "f-ap-caption" && (x.status === "jadual" || x.status === "posted")) { apDraft.caption = x.caption; changed = true; }
          if (changed) renderApDrawer();
        }
      }
      renderNav(); if (view === "jadual") { renderJadual(); if (!apDraft) renderApDrawer(); }
      ready(s.metadata.fromCache);
    }, err);
    db.doc("settings/main").onSnapshot((s) => { const sig = () => JSON.stringify([settings.zernio, settings.folders]); const had = sig(); if (s.exists) settings = { weeklyTarget: 4, ...s.data() }; if (view === "video") renderTarget(); if (draft && sig() !== had) renderDrawer(); if (sig() !== had && view === "jadual") { renderApBoard(); if (apDraft) renderApDrawer(); } ready(s.metadata.fromCache); }, err);
  })();
})();
</script>

</body></html>
